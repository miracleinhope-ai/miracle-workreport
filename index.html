<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SiKerja Akuntansi Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{
  --blue:#2563eb;--blue2:#1e40af;--pink:#ec4899;--pink2:#db2777;
  --grad:linear-gradient(135deg,#2563eb,#ec4899);
  --grad2:linear-gradient(135deg,#1e40af,#db2777);
  --gray:#f8fafc;--gray2:#e2e8f0;--text:#1e293b;--sub:#64748b;
  --green:#10b981;--orange:#f59e0b;--red:#ef4444;
}
#loginScreen{position:fixed;inset:0;background:var(--grad);display:flex;align-items:center;justify-content:center;z-index:999}
.loginBox{background:#fff;border-radius:20px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);text-align:center}
.loginBox h1{font-size:1.6rem;color:var(--text);margin-bottom:4px}
.loginBox p{color:var(--sub);font-size:.9rem;margin-bottom:24px}
.loginBox select,.loginBox input{width:100%;padding:12px 14px;border:1.5px solid var(--gray2);border-radius:10px;font-size:.95rem;margin-bottom:12px;outline:none;color:var(--text)}
.loginBox select:focus,.loginBox input:focus{border-color:var(--blue)}
.btnLogin{width:100%;padding:13px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.loginLogo{width:60px;height:60px;background:var(--grad);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem}
body{display:flex;height:100vh;overflow:hidden;background:var(--gray)}
#sidebar{width:240px;min-width:240px;background:var(--grad2);display:flex;flex-direction:column;z-index:10;transition:width .22s ease,min-width .22s ease}
#sidebar.collapsed{width:0;min-width:0;overflow:hidden;border:none}
.sideTop{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sideTop h2{color:#fff;font-size:.98rem;font-weight:700;line-height:1.2}
.sideTop p{color:rgba(255,255,255,.65);font-size:.7rem;margin-top:2px}
.btnSideHide{background:rgba(255,255,255,.16);border:none;color:#fff;width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:.82rem;flex-shrink:0}
.btnSideHide:hover{background:rgba(255,255,255,.28)}
.userBadge{margin:8px 12px 6px;background:rgba(255,255,255,.15);border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:9px}
.userAvatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:.88rem;flex-shrink:0}
.userInfo p{color:#fff;font-size:.82rem;font-weight:600}
.userInfo span{color:rgba(255,255,255,.65);font-size:.7rem}
/* FLOATING MENU WHEN SIDEBAR COLLAPSED */
#floatingMenu{position:fixed;left:12px;top:68px;background:var(--grad2);border-radius:16px;padding:8px 6px;box-shadow:0 10px 30px rgba(30,64,175,.32);z-index:80;display:none;flex-direction:column;align-items:center;gap:4px}
#floatingMenu.show{display:flex}
#floatingMenu a,#floatingMenu button{position:relative;width:40px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);text-decoration:none;font-size:1.05rem;cursor:pointer;border:none;background:transparent;transition:.15s}
#floatingMenu a:hover,#floatingMenu a.active,#floatingMenu button:hover{background:rgba(255,255,255,.24);color:#fff}
#floatingMenu a[data-label]:hover::after,#floatingMenu button[data-label]:hover::after{content:attr(data-label);position:absolute;left:50px;top:50%;transform:translateY(-50%);background:#0f172a;color:#fff;padding:5px 10px;border-radius:7px;font-size:.75rem;font-weight:600;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:none;z-index:90}
.floatSep{width:26px;height:1px;background:rgba(255,255,255,.2);margin:3px 0}
body.side-collapsed #main .content{padding-left:68px}
/* SIDEBAR SCROLL */
nav{flex:1;padding:6px 10px;overflow-y:auto;scroll-behavior:smooth}
nav a{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:9px;color:rgba(255,255,255,.8);text-decoration:none;font-size:.85rem;margin-bottom:1px;cursor:pointer;transition:.15s}
nav a:hover,nav a.active{background:rgba(255,255,255,.2);color:#fff}
nav a .ico{font-size:1rem;width:20px;text-align:center}
.sideBottom{padding:10px 16px;border-top:1px solid rgba(255,255,255,.15)}
.btnLogout{width:100%;padding:8px;background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;font-size:.82rem;cursor:pointer}
.btnLogout:hover{background:rgba(255,255,255,.25)}
#main{flex:1;overflow-y:auto;position:relative;display:flex;flex-direction:column}
.topbar{background:#fff;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray2);position:sticky;top:0;z-index:5}
.topbar h3{font-size:1rem;color:var(--text);font-weight:700}
.content{padding:20px 24px;flex:1;position:relative}
.bgDeco{position:fixed;bottom:0;right:0;width:300px;height:200px;background:var(--grad);opacity:.07;border-radius:100% 0 0 0;pointer-events:none;z-index:0}
.bgDeco2{position:fixed;bottom:0;right:0;width:160px;height:110px;background:var(--grad);opacity:.09;border-radius:100% 0 0 0;pointer-events:none;z-index:0}
.cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;position:relative;z-index:1}
.card{background:#fff;border-radius:13px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);position:relative;overflow:hidden}
.card .cardIcon{font-size:1.6rem;margin-bottom:6px}
.card .cardVal{font-size:1.7rem;font-weight:800;color:var(--text)}
.card .cardLabel{font-size:.76rem;color:var(--sub);margin-top:1px}
.card .cardAccent{position:absolute;right:-10px;bottom:-10px;width:55px;height:55px;border-radius:50%;opacity:.13}
.acc-blue{background:var(--blue)}.acc-pink{background:var(--pink)}.acc-green{background:var(--green)}.acc-orange{background:var(--orange)}
.section{background:#fff;border-radius:13px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px;position:relative;z-index:1}
.secHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.secHead h4{font-size:.9rem;font-weight:700;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:7px 10px;color:var(--sub);font-weight:600;border-bottom:2px solid var(--gray2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--gray2);color:var(--text);vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:600}
.b-urgent{background:#fee2e2;color:#dc2626}.b-normal{background:#dbeafe;color:#2563eb}
.b-done{background:#d1fae5;color:#059669}.b-progress{background:#fef3c7;color:#d97706}
.b-plan{background:#ede9fe;color:#7c3aed}.b-green{background:#d1fae5;color:#059669}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formGroup{display:flex;flex-direction:column;gap:3px}
.formGroup.full{grid-column:1/-1}
label{font-size:.76rem;color:var(--sub);font-weight:600}
input,select,textarea{padding:8px 10px;border:1.5px solid var(--gray2);border-radius:7px;font-size:.84rem;color:var(--text);outline:none;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:60px}
.btnPrimary{padding:9px 18px;background:var(--grad);color:#fff;border:none;border-radius:7px;font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btnPrimary:hover{opacity:.9}
.btnSm{padding:5px 10px;border:none;border-radius:5px;font-size:.74rem;cursor:pointer;margin-right:3px}
.btnEdit{background:#dbeafe;color:#2563eb}.btnDanger{background:#fee2e2;color:#dc2626}.btnGray{background:var(--gray2);color:var(--sub)}
.filterBar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filterBar select,.filterBar input{padding:6px 9px;font-size:.79rem;border-radius:6px}
.viewToggle{display:flex;gap:4px;background:var(--gray);border-radius:8px;padding:3px}
.viewBtn{padding:5px 12px;border:none;border-radius:6px;font-size:.78rem;cursor:pointer;color:var(--sub);background:transparent;transition:.15s}
.viewBtn.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.kanbanWrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kanbanCol{min-width:230px;max-width:230px;background:var(--gray);border-radius:10px;padding:10px}
.kanbanCol h5{font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kanbanCard{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:grab;border-left:3px solid transparent}
.kanbanCard.urgent{border-left-color:var(--red)}.kanbanCard.normal{border-left-color:var(--blue)}
.kanbanCard h6{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:4px}
.kanbanCard p{font-size:.72rem;color:var(--sub)}
.kanbanCard .cardMeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.calWrap{overflow-x:auto}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:560px}
.calHead{text-align:center;padding:6px;font-size:.74rem;font-weight:700;color:var(--sub)}
.calCell{min-height:80px;background:var(--gray);border-radius:6px;padding:4px;font-size:.72rem}
.calCell.today{background:#eff6ff;border:1.5px solid var(--blue)}
.calDate{font-weight:700;color:var(--text);margin-bottom:2px}
.calEvent{background:var(--blue);color:#fff;border-radius:3px;padding:1px 4px;margin-bottom:1px;font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.calEvent.urgent{background:var(--red)}
.timerBar{display:flex;align-items:center;gap:10px;background:var(--gray);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.82rem}
.timerDisplay{font-size:1.1rem;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;min-width:70px}
.btnTimer{padding:6px 14px;border:none;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer}
.btnStart{background:#d1fae5;color:#059669}.btnStop{background:#fee2e2;color:#dc2626}
.subtaskList{margin-top:8px;border-top:1px solid var(--gray2);padding-top:8px}
.subtaskItem{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray2);font-size:.8rem}
.subtaskItem:last-child{border:none}
.subtaskItem input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.subtaskItem span.done{text-decoration:line-through;color:var(--sub)}
.commentList{margin-top:8px}
.commentItem{display:flex;gap:8px;margin-bottom:10px}
.commentAvatar{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;flex-shrink:0}
.commentBody{flex:1;background:var(--gray);border-radius:8px;padding:8px 10px}
.commentBody .cmeta{font-size:.72rem;color:var(--sub);margin-bottom:3px}
.commentBody p{font-size:.8rem;color:var(--text)}
.commentInput{display:flex;gap:8px;margin-top:8px}
.commentInput input{flex:1;padding:7px 10px;border:1.5px solid var(--gray2);border-radius:7px;font-size:.82rem}
.docList{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.docCard{background:#fff;border-radius:10px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;border:1.5px solid transparent;transition:.15s}
.docCard:hover{border-color:var(--blue)}
.docCard .docIcon{font-size:1.6rem;margin-bottom:6px}
.docCard h6{font-size:.84rem;font-weight:700;color:var(--text);margin-bottom:3px}
.docCard p{font-size:.74rem;color:var(--sub)}
.docEditor{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.docEditor input.docTitle{font-size:1.2rem;font-weight:700;border:none;outline:none;width:100%;color:var(--text);margin-bottom:10px;border-bottom:2px solid var(--gray2);padding-bottom:8px}
.docEditor textarea.docBody{width:100%;min-height:300px;border:none;outline:none;font-size:.88rem;color:var(--text);resize:none;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.modalBox{background:#fff;border-radius:16px;padding:24px;width:580px;max-width:96vw;max-height:92vh;overflow-y:auto}
.modalBox h4{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:16px}
.abToday{display:flex;flex-wrap:wrap;gap:8px}
.abCard{background:var(--gray);border-radius:9px;padding:9px 12px;font-size:.79rem;display:flex;align-items:center;gap:7px}
.abCard .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.abCard .dot.absent{background:var(--gray2)}
.detailPanel{position:fixed;right:0;top:0;bottom:0;width:420px;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:50;overflow-y:auto;transform:translateX(100%);transition:.25s}
.detailPanel.open{transform:translateX(0)}
.detailTop{padding:18px 20px;border-bottom:1px solid var(--gray2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.detailBody{padding:18px 20px}
.detailSection{margin-bottom:16px}
.detailSection h5{font-size:.78rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.notifDot{width:7px;height:7px;background:var(--red);border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}
.notifList{position:absolute;right:0;top:100%;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);width:300px;z-index:20;padding:10px 0;display:none}
.notifList.open{display:block}
.notifItem{padding:10px 16px;font-size:.8rem;border-bottom:1px solid var(--gray2);cursor:pointer}
.notifItem:last-child{border:none}
.notifItem:hover{background:var(--gray)}
.notifItem .ni-title{font-weight:600;color:var(--text)}
.notifItem .ni-sub{color:var(--sub);font-size:.74rem;margin-top:2px}
.notifBtn{position:relative;background:none;border:none;cursor:pointer;font-size:1.2rem;padding:4px}
/* PAGINATION */
.pagination{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.82rem;color:var(--sub)}
.pagination select{padding:4px 8px;border:1.5px solid var(--gray2);border-radius:6px;font-size:.8rem}
.pagination span{margin-left:auto}
.rowsLabel{font-size:.8rem;color:var(--sub)}
/* LOCK BADGE */
.lockBadge{font-size:.68rem;color:var(--sub);margin-left:4px}
.hidden{display:none!important}
.mt10{margin-top:10px}
.flex{display:flex;gap:8px;align-items:center}
.progressBar{height:6px;background:var(--gray2);border-radius:3px;margin-top:6px}
.progressFill{height:100%;border-radius:3px;background:var(--grad)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;background:#ede9fe;color:#7c3aed;margin-right:3px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:.84rem;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.accessDenied{text-align:center;padding:60px 20px;color:var(--sub)}
.accessDenied .icon{font-size:3rem;margin-bottom:12px}
.accessDenied p{font-size:.9rem}
/* ===== RENCANA HARIAN ===== */
.rCard{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:10px;border-left:4px solid var(--orange);position:relative}
.rCard.selesai{border-left-color:var(--green)}
.rCard-title{font-weight:700;font-size:.88rem;color:var(--text)}
.rCard-meta{font-size:.75rem;color:var(--sub);margin-top:3px}
.rLaporan{background:#f0fdf4;border-radius:7px;padding:8px 10px;font-size:.8rem;color:#065f46;margin-top:8px;border-left:3px solid var(--green)}
.kpiRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpiBox{flex:1;min-width:110px;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.kpiBox .kv{font-size:1.5rem;font-weight:800;color:var(--text);display:block}
.kpiBox .kl{font-size:.72rem;color:var(--sub);margin-top:2px;display:block}
/* Calendar fix */
.calWrap{overflow:hidden}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:100%}
.calCell{height:90px;background:var(--gray);border-radius:6px;padding:5px;overflow:hidden;transition:.15s}
.calCell:not(.empty){cursor:pointer}.calCell:not(.empty):hover{background:#dbeafe}
.calCell.today{background:#eff6ff;border:2px solid var(--blue)}
.calCell.empty{opacity:.35;cursor:default}
.calDate{font-weight:700;color:var(--text);font-size:.74rem;margin-bottom:2px}
.calUserBadge{background:var(--blue);color:#fff;border-radius:3px;padding:1px 5px;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;display:block}
/* Lock overlay */
.rLockOverlay{position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:400;display:flex;align-items:center;justify-content:center}
.rLockBox{background:#fff;border-radius:16px;padding:28px 32px;width:540px;max-width:95vw;max-height:92vh;overflow-y:auto}
.rLockBox h3{font-size:1.05rem;font-weight:800;color:var(--text);margin-bottom:6px}
.rLockBox .rLockSub{font-size:.84rem;color:var(--sub);margin-bottom:18px}
/* ===== DASHBOARD MODERN & CHARTS ===== */
.dashFilter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px;position:relative;z-index:1}
.dashFilter select,.dashFilter input{padding:6px 10px;font-size:.8rem;border-radius:7px}
.chartGrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:16px;position:relative;z-index:1}
.chartCard{background:#fff;border-radius:13px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media(max-width:960px){.span-8,.span-4,.span-6{grid-column:span 12}}
.chartWrap{position:relative;height:250px;width:100%}
.chartWrap.tall{height:290px}
.alertBanner{border-radius:11px;padding:12px 16px;margin-bottom:14px;font-size:.83rem;display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1}
.alertBanner.warn{background:#fef3c7;border-left:4px solid #f59e0b;color:#92400e}
.alertBanner.danger{background:#fee2e2;border-left:4px solid #ef4444;color:#991b1b}
.alertBanner.info{background:#eff6ff;border-left:4px solid #2563eb;color:#1e40af}
.riskItem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:9px;background:var(--gray);margin-bottom:8px;border-left:4px solid var(--orange)}
.riskItem.kritis{border-left-color:var(--red);background:#fef2f2}
.riskScore{font-size:1.1rem;font-weight:800;min-width:48px;text-align:center}
.b-late{background:#fee2e2;color:#dc2626}.b-warn{background:#fef3c7;color:#d97706}.b-info{background:#dbeafe;color:#2563eb}
.witaPill{font-size:.74rem;background:#eff6ff;color:#1e40af;padding:4px 10px;border-radius:20px;font-weight:600;border:1px solid #bfdbfe}
.btnTiny{padding:4px 9px;border:none;border-radius:5px;font-size:.73rem;font-weight:600;cursor:pointer}
.btnChat{background:#ede9fe;color:#6d28d9;padding:4px 8px;border:none;border-radius:5px;font-size:.73rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btnChat.hasUnread{background:#fef3c7;color:#b45309;border:1px solid #f59e0b}
.mentionGrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mentionOpt{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--gray);border:1.5px solid var(--gray2);font-size:.76rem;cursor:pointer;user-select:none}
.mentionOpt input{width:13px;height:13px;accent-color:var(--blue)}
.mentionChip{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:1px 7px;border-radius:12px;font-size:.7rem;font-weight:600;margin-right:3px}
.cmtInstruksi{background:#fef3c7!important;border-left:4px solid #f59e0b}

// ===== ZONA WAKTU WITA (Asia/Makassar, UTC+8) & JAM SERVER =====
async function syncServerTime(){
  try{
    const t0 = Date.now();
    const { data, error } = await sb.rpc('get_server_time');
    if(!error && data){
      const t1 = Date.now();
      const srv = new Date(data).getTime() + Math.round((t1 - t0)/2);
      serverOffsetMs = srv - t1;
    }
  }catch(_){}
}
const nowWitaDate = () => new Date(Date.now() + serverOffsetMs);
const todayStr    = (d = nowWitaDate()) => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const nowTime     = (d = nowWitaDate()) => new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
const fmtTimeWita = iso => { if(!iso) return '-'; try{ return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) + ' WITA'; }catch(_){ return '-'; } };
const witaHourMin = (d = nowWitaDate()) => {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
  return { h: +(parts.find(p=>p.type==='hour')?.value||0), m: +(parts.find(p=>p.type==='minute')?.value||0) };
};
const witaMonthYear = (d = nowWitaDate()) => {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Makassar', year: 'numeric', month: '2-digit' }).format(d).split('-');
  return { tahun: +parts[0], bulan: +parts[1] };
};
setInterval(()=>{
  const el = document.getElementById('witaClock');
  if(el) el.textContent = nowTime() + ' WITA';
}, 10000);

// ===== UTILS =====
const isAdmin    = () => currentUser && (currentUser.role === 'admin' || currentUser.role === 'superadmin');
const fmtDate    = s => { if(!s)return'-'; const[y,m,d]=s.split('T')[0].split('-'); return`${d}/${m}/${y}`; };
const fmtDateL   = s => { if(!s)return'-'; const[y,m,d]=s.split('T')[0].split('-'); return`${d} ${BULAN_SINGKAT[+m-1]} ${y}`; };
const pageDate   = () => { const d=nowWitaDate(); const dy=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']; const [y,m,day]=todayStr(d).split('-'); const wd=new Date(`${y}-${m}-${day}T12:00:00Z`).getUTCDay(); return`${dy[wd]}, ${+day} ${BULAN_NAMA[+m-1]} ${y}`; };
const fmtDur     = s => { s=Math.max(0,Math.round(s||0)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; return`${h>0?h+'j ':''}${m}m ${sc}s`.trim(); };
const fmtDurHM   = s => { s=Math.max(0,Math.round(s||0)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?`${h}j ${m}m`:`${m}m`; };
const badgeSt    = s => s==='Selesai'?'b-done':s==='Dalam Proses'?'b-progress':'b-plan';
const esc        = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeUrl    = u => { try{ const p=new URL(String(u||'')); return (p.protocol==='http:'||p.protocol==='https:') ? u : '#'; }catch(_){ return '#'; } };

function canEditPek(p){
  if(!currentUser) return false;
  if(isAdmin()) return true;
  // non-admin hanya bisa edit pekerjaan yang dibuat sendiri
  return p.created_by === currentUser.id;
}

function toast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

// ===== REALTIME =====
function setupRealtime(){
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('sikerja-realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},      onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'klien'},      onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'pekerjaan'},  onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'absensi'},    onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'docs'},       onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},   onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'timelogs'},         onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'rencana_harian'},   onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'m_sistem_kerja'},   onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'m_jenis_tindakan'}, onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'tindakan_harian'},  onRealtimeChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'tindakan_comments'},onRealtimeChange)
    .subscribe(status=>{
      if(status==='SUBSCRIBED') showRealtimeDot(true);
      if(status==='CLOSED'||status==='CHANNEL_ERROR') showRealtimeDot(false);
    });
}

function teardownRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel=null; }
  clearTimeout(realtimeDebounce);
  showRealtimeDot(false);
}

function onRealtimeChange(){
  clearTimeout(realtimeDebounce);
  realtimeDebounce = setTimeout(async()=>{
    await loadAll();
    showPage(currentPage);
  }, 400);
}

function showRealtimeDot(on){
  let dot = document.getElementById('realtimeDot');
  if(!dot){
    dot = document.createElement('span');
    dot.id = 'realtimeDot';
    dot.title = 'Realtime';
    dot.style.cssText='width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:6px;vertical-align:middle;transition:.3s';

    if(h3) h3.appendChild(dot);
  }

}

// ===== LOAD =====
async function loadAll(){
  const [u,k,p,a,d,c,tl,r,sk,jt,th,tc] = await Promise.all([
    sb.from('users').select('*').order('created_at'),
    sb.from('klien').select('*').order('nama'),
    sb.from('pekerjaan').select('*').order('created_at'),
    sb.from('absensi').select('*').order('tanggal',{ascending:false}),
    sb.from('docs').select('*').order('updated_at',{ascending:false}),
    sb.from('comments').select('*').order('created_at'),
    sb.from('timelogs').select('*').order('created_at'),
    sb.from('rencana_harian').select('*').order('created_at'),
    sb.from('m_sistem_kerja').select('*').order('urutan'),
    sb.from('m_jenis_tindakan').select('*').order('urutan'),
    sb.from('tindakan_harian').select('*').order('created_at'),
    sb.from('tindakan_comments').select('*').order('created_at'),
  ]);
  CACHE.users     = u.data||[];
  CACHE.klien     = k.data||[];
  CACHE.pekerjaan = p.data||[];
  CACHE.absensi   = a.data||[];
  CACHE.docs      = d.data||[];
  CACHE.comments  = c.data||[];
  CACHE.timelogs  = tl.data||[];
  CACHE.rencana   = r.data||[];
  CACHE.sistem    = sk.data||[];
  CACHE.jenis     = jt.data||[];
  CACHE.tindakan  = th.data||[];
  CACHE.tcomments = tc.data||[];
  migrationReady  = !sk.error && !jt.error && !th.error && !tc.error;
}

// ===== LOGIN =====
async function initLogin(){
  const sel=document.getElementById('loginUser');
  const err=document.getElementById('loginErr');
  sel.innerHTML='<option value="">⏳ Memuat user...</option>';
  try{
    const {data,error}=await sb.from('users').select('*').order('created_at');
    if(error) throw error;
    const users=data||[];
    sel.innerHTML='<option value="">-- Pilih User --</option>';
    if(!users.length){ err.textContent='⚠️ Belum ada user. Jalankan SQL insert user di Supabase.'; return; }
    users.forEach(u=>{ const o=document.createElement('option'); o.value=u.id; const lbl=u.role==='superadmin'?' (Superadmin)':u.role==='admin'?' (Admin)':' (Asisten)'; o.textContent=u.nama+lbl; sel.appendChild(o); });
    err.textContent='';
  }catch(e){
    sel.innerHTML='<option value="">-- Gagal memuat --</option>';
    err.textContent='❌ Koneksi Supabase gagal: '+(e.message||e);
  }
}

async function doLogin(){
  const uid=document.getElementById('loginUser').value;
  const pin=document.getElementById('loginPin').value;
  const err=document.getElementById('loginErr');
  err.textContent='';
  if(!uid){ err.textContent='Pilih user terlebih dahulu!'; return; }
  const {data:users}=await sb.from('users').select('*').eq('id',uid);
  const user=users&&users[0];
  if(!user){ err.textContent='User tidak ditemukan!'; return; }
  if(user.pin&&user.pin!==pin){ err.textContent='PIN salah!'; return; }

  await syncServerTime();
  currentUser=user;
  const { h, m: mn } = witaHourMin();
  const isLate = (h > 8 || (h === 8 && mn > 0));
  const menitTerlambat = isLate ? ((h - 8) * 60 + mn) : 0;
  const jamWita = nowTime();
  const today = todayStr();

  const {data:abCek}=await sb.from('absensi').select('id').eq('user_id',uid).eq('tanggal',today);
  if(!abCek||!abCek.length){
    const insPayload = {user_id:uid, nama:user.nama, tanggal:today, jam:jamWita, tipe:isLate?'Terlambat':'Masuk', terlambat:isLate, menit_terlambat:menitTerlambat};
    const { error: abErr } = await sb.from('absensi').insert(insPayload);
    if(abErr){
      // fallback jika kolom terlambat belum dimigrasi
      await sb.from('absensi').insert({user_id:uid, nama:user.nama, tanggal:today, jam:jamWita, tipe:isLate?'Terlambat':'Masuk'});
    }
  }
  await loadAll();

  // Hitung frekuensi keterlambatan user ini
  const ymPrefix = today.slice(0,7);
  const myAbs = CACHE.absensi.filter(a=>a.user_id===uid);
  const isRowLate = a => a.terlambat===true || a.tipe==='Terlambat' || (a.jam && a.jam>'08:00');
  const lateTotal = myAbs.filter(isRowLate).length;
  const lateMonth = myAbs.filter(a=>a.tanggal&&a.tanggal.startsWith(ymPrefix)&&isRowLate(a)).length;
  const todayAb = myAbs.find(a=>a.tanggal===today);
  const todayLate = todayAb ? isRowLate(todayAb) : isLate;
  loginLateInfo = { isLate: todayLate, jam: todayAb?.jam || jamWita, menitTerlambat: todayAb?.menit_terlambat || menitTerlambat, lateMonth, lateTotal };

  const my = witaMonthYear();
  dashFilter = { bulan: my.bulan, tahun: my.tahun, userId: '', klienId: '' };
  tindakanFilter = { tanggal: today, bulan: my.bulan, tahun: my.tahun, klienId: '', userId: '' };
  const firstDayOfMonth = `${my.tahun}-${String(my.bulan).padStart(2,'0')}-01`;
  pekFilter = { dari: firstDayOfMonth, sampai: today, userId: '', klienId: '', status: '', q: '' };
  abCalYear = my.tahun; abCalMonth = my.bulan - 1;

  document.getElementById('loginScreen').style.display='none';
  document.getElementById('sideAvatar').textContent=user.nama.charAt(0).toUpperCase();
  document.getElementById('sideName').textContent=user.nama;
  document.getElementById('sideRole').textContent=user.role==='superadmin'?'Superadmin':user.role==='admin'?'Admin / Akuntan':'Asisten';
  const fBtn = document.getElementById('floatUserBtn');
  if(fBtn){ fBtn.textContent=user.nama.charAt(0).toUpperCase(); fBtn.dataset.label=`${user.nama} (${user.role})`; }
  document.getElementById('navKlien').style.display=isAdmin()?'flex':'none';
  document.getElementById('navUsers').style.display=isAdmin()?'flex':'none';
  document.getElementById('navMaster').style.display=isAdmin()?'flex':'none';
  document.getElementById('fNavKlien').style.display=isAdmin()?'flex':'none';
  document.getElementById('fNavUsers').style.display=isAdmin()?'flex':'none';
  document.getElementById('fNavMaster').style.display=isAdmin()?'flex':'none';
  const wc = document.getElementById('witaClock'); if(wc) wc.textContent = nowTime() + ' WITA';
  setupRealtime();

  if(!isAdmin() && todayLate){
    toast(`⚠️ Terlambat masuk (${loginLateInfo.jam} WITA). Tercatat ${lateMonth}x bulan ini (${lateTotal}x total).`, 5000);
  }
  if(isAdmin()){
    setTimeout(()=>notifySuperadminDesktop(), 800);
  }

  // ===== ALUR POP-UP ASISTEN SAAT LOGIN =====
  if(!isAdmin() && migrationReady){
    const unreadArahan = getAllUnreadCommentsForUser(user.id);
    if(unreadArahan.length){
      showPage('dashboard');
      setTimeout(()=>showForcedArahanModal(), 300);
      return;
    }
    if(continueAssistantLoginFlow()) return;
  }
  showPage('dashboard');
}

function continueAssistantLoginFlow(){
  if(isAdmin() || !migrationReady) return false;
  const today = todayStr();
  const uid = currentUser.id;
  // 1. Cek jika ada tindakan belum di-closing (hari ini atau hari sebelumnya)
  const unclosed = CACHE.tindakan
    .filter(t=>t.user_id===uid && (t.status==='rencana'||t.status==='dikerjakan'))
    .sort((a,b)=>a.tanggal_kerja.localeCompare(b.tanggal_kerja)||(a.created_at||'').localeCompare(b.created_at||''));
  if(unclosed.length){
    showPage('dashboard');
    setTimeout(()=>showForcedClosingModal(unclosed[0].id), 250);
    return true;
  }
  // 2. Belum ada tindakan sama sekali hari ini -> langsung buka pop-up form rencana awal hari
  const todayTindakan = CACHE.tindakan.filter(t=>t.user_id===uid && t.tanggal_kerja===today);
  if(!todayTindakan.length){
    showPage('dashboard');
    setTimeout(()=>showForcedRencanaModal(), 250);
    return true;
  }
  // 3. Sudah ada tindakan hari ini & semua sudah di-closing, tapi belum closing akhir hari -> tanyakan lanjut atau closing akhir hari
  const todayAb = CACHE.absensi.find(a=>a.user_id===uid && a.tanggal===today);
  if(!todayAb || !todayAb.jam_keluar){
    showPage('dashboard');
    setTimeout(()=>showAfterClosingChoiceModal(), 250);
    return true;
  }
  return false;
}

// ===== MESIN KPI (K1-K15, SRK, IKU, SKU) =====
function computeKPIs(bulan, tahun, filterUserId='', filterKlienId=''){
  const ym = `${tahun}-${String(bulan).padStart(2,'0')}`;
  const today = todayStr();

  const allT = CACHE.tindakan || [];
  let periodT = allT.filter(t => t.tanggal_kerja && t.tanggal_kerja.startsWith(ym));
  if(filterUserId) periodT = periodT.filter(t => t.user_id === filterUserId);
  if(filterKlienId) periodT = periodT.filter(t => t.klien_id === filterKlienId);

  const todayT = allT.filter(t => t.tanggal_kerja === today && (!filterUserId || t.user_id === filterUserId) && (!filterKlienId || t.klien_id === filterKlienId));

  // Absensi & keterlambatan
  const isRowLate = a => a.terlambat===true || a.tipe==='Terlambat' || (a.jam && a.jam>'08:00');
  const periodAbs = (CACHE.absensi || []).filter(a => a.tanggal && a.tanggal.startsWith(ym) && (!filterUserId || a.user_id === filterUserId));
  const staffUsers = (CACHE.users || []).filter(u => u.role !== 'admin' && u.role !== 'superadmin');
  const staffIds = new Set(staffUsers.map(u=>u.id));
  const staffPeriodAbs = periodAbs.filter(a => staffIds.has(a.user_id));
  const lateAbs = staffPeriodAbs.filter(isRowLate);
  const compliancePct = staffPeriodAbs.length ? Math.round((staffPeriodAbs.length - lateAbs.length) / staffPeriodAbs.length * 100) : 100;
  const avgLateMin = lateAbs.length ? Math.round(lateAbs.reduce((s,a)=>{
    if(a.menit_terlambat) return s + a.menit_terlambat;
    if(a.jam && a.jam>'08:00'){ const [hh,mm]=a.jam.split(':').map(Number); return s + Math.max(0,(hh-8)*60+mm); }
    return s;
  },0) / lateAbs.length) : 0;

  // K4: Jumlah klien dikerjakan dalam periode
  const distinctClients = new Set(periodT.map(t=>t.klien_id).filter(Boolean)).size;

  // K7, K8, K9, K10, K11
  const totalT = periodT.length;
  const doneT = periodT.filter(t=>t.status==='selesai').length;
  const closedT = periodT.filter(t=>t.status==='selesai'||t.status==='lanjut'||t.status==='bermasalah').length;
  const sameDayClosed = periodT.filter(t=>t.closing_at && todayStr(new Date(t.closing_at))===t.tanggal_kerja).length;
  const closingPct = totalT ? Math.round(sameDayClosed / totalT * 100) : 100;
  const realisasiPct = totalT ? Math.round(doneT / totalT * 100) : 0;
  const ulangCount = periodT.filter(t=>t.is_ulang).length;
  const kendalaCount = periodT.filter(t=>t.kendala && t.kendala.trim()!=='').length;
  const rrPct = totalT ? Math.round(ulangCount / totalT * 100) : 0;
  const prPct = totalT ? Math.round(kendalaCount / totalT * 100) : 0;

  // FTR (K9): kombinasi (klien+sistem+periode) yang selesai tanpa pengulangan
  const comboMap = {};
  periodT.forEach(t=>{
    const key = `${t.klien_id}|${t.sistem_id}|${t.periode_bulan}|${t.periode_tahun}`;
    if(!comboMap[key]) comboMap[key] = { hasUlang: false, hasDone: false };
    if(t.is_ulang) comboMap[key].hasUlang = true;
    if(t.status==='selesai') comboMap[key].hasDone = true;
  });
  const combos = Object.values(comboMap);
  const ftrPct = combos.length ? Math.round(combos.filter(c=>!c.hasUlang && c.hasDone).length / combos.length * 100) : 100;

  // K3 & SRK (Skor Risiko Klien)
  const byClient = {};
  periodT.forEach(t=>{
    if(!t.klien_id) return;
    if(!byClient[t.klien_id]) byClient[t.klien_id] = { klien_id: t.klien_id, items: [], dates: new Set(), durasi: 0, ulang: 0, kendala: 0, internalKendala: 0 };
    const bc = byClient[t.klien_id];
    bc.items.push(t);
    bc.dates.add(t.tanggal_kerja);
    bc.durasi += (t.durasi_detik || 0);
    if(t.is_ulang) bc.ulang++;
    if(t.kendala && t.kendala.trim()!=='') bc.kendala++;
    if(t.sifat_kendala==='internal') bc.internalKendala++;
  });

  const clientRows = Object.values(byClient).map(bc=>{
    const k = CACHE.klien.find(x=>x.id===bc.klien_id);
    const n = bc.items.length;
    const avgDur = n ? bc.durasi / n : 0;
    return {
      klien_id: bc.klien_id,
      nama: k ? k.nama : 'Klien',
      count: n,
      normalCount: n - bc.ulang,
      ulang: bc.ulang,
      kendala: bc.kendala,
      internalKendala: bc.internalKendala,
      durasi: bc.durasi,
      avgDur,
      dates: [...bc.dates].sort(),
      items: bc.items
    };
  });

  const durs = clientRows.map(r=>r.avgDur).filter(v=>v>0).sort((a,b)=>a-b);
  const medianDur = durs.length ? durs[Math.floor(durs.length/2)] : 0;
  const maxCount = clientRows.length ? Math.max(...clientRows.map(r=>r.count)) : 1;

  clientRows.forEach(r=>{
    const rr = r.count ? r.ulang / r.count : 0;
    const pr = r.count ? r.kendala / r.count : 0;
    const relDur = medianDur > 0 ? Math.min(r.avgDur / medianDur, 2) / 2 : 0;
    const fRel = maxCount > 0 ? r.count / maxCount : 0;
    r.srk = Math.round(100 * (0.35 * rr + 0.30 * pr + 0.20 * relDur + 0.15 * fRel));
    r.srkValid = r.count >= 5;
    r.riskLevel = r.srk >= 50 ? 'kritis' : r.srk >= 30 ? 'perhatian' : 'normal';

    // Hitung IKU per user di klien ini
    const byU = {};
    r.items.forEach(t=>{
      if(!byU[t.user_id]) byU[t.user_id] = { total:0, ulang:0, internal:0 };
      byU[t.user_id].total++;
      if(t.is_ulang) byU[t.user_id].ulang++;
      if(t.sifat_kendala==='internal') byU[t.user_id].internal++;
    });
    const uKeys = Object.keys(byU);
    let maxIku = 0, suspectUser = null;
    uKeys.forEach(uid=>{
      const me = byU[uid];
      const errMe = (me.ulang + me.internal) / me.total;
      const others = uKeys.filter(x=>x!==uid);
      let errOther = errMe;
      if(others.length){
        const oTot = others.reduce((s,x)=>s+byU[x].total,0);
        const oErr = others.reduce((s,x)=>s+byU[x].ulang+byU[x].internal,0);
        errOther = oTot ? oErr / oTot : 0;
      } else {
        // Jika hanya 1 user, bandingkan dengan standar baseline 0.10
        errOther = 0.10;
      }
      const iku = errMe / (errOther + 0.05);
      if(iku > maxIku){ maxIku = iku; suspectUser = uid; }
    });
    r.maxIku = Number(maxIku.toFixed(2));
    r.suspectUser = suspectUser ? (CACHE.users.find(u=>u.id===suspectUser)?.nama || '-') : '-';
    if(r.srk >= 30){
      if(r.maxIku >= 1.5 && r.internalKendala + r.ulang > 0){
        r.diagnosis = `👤 Indikasi kelalaian: ${r.suspectUser} (IKU ${r.maxIku})`;
      } else {
        r.diagnosis = `🏢 Klien sulit / data bermasalah`;
      }
    } else if(r.maxIku >= 1.5 && r.ulang + r.internalKendala >= 2){
      r.diagnosis = `👤 Perlu cek ketelitian: ${r.suspectUser}`;
    } else {
      r.diagnosis = `✅ Normal`;
    }
  });
  clientRows.sort((a,b)=>b.count - a.count || b.srk - a.srk);

  // SKU (Skor Kualitas User) & keterlambatan per user
  const userRows = (CACHE.users || []).filter(u=>u.role!=='superadmin'||periodT.some(t=>t.user_id===u.id)).map(u=>{
    const uT = periodT.filter(t=>t.user_id===u.id);
    const uN = uT.length;
    const uDone = uT.filter(t=>t.status==='selesai').length;
    const uUlang = uT.filter(t=>t.is_ulang).length;
    const uInt = uT.filter(t=>t.sifat_kendala==='internal').length;
    const uKend = uT.filter(t=>t.kendala && t.kendala.trim()!=='').length;
    const uDur = uT.reduce((s,t)=>s+(t.durasi_detik||0),0);
    const uSameClose = uT.filter(t=>t.closing_at && todayStr(new Date(t.closing_at))===t.tanggal_kerja).length;

    const uAbsAll = (CACHE.absensi || []).filter(a=>a.user_id===u.id);
    const uAbsMonth = uAbsAll.filter(a=>a.tanggal && a.tanggal.startsWith(ym));
    const uLateMonth = uAbsMonth.filter(isRowLate).length;
    const uLateTotal = uAbsAll.filter(isRowLate).length;
    const k5 = uAbsMonth.length ? (uAbsMonth.length - uLateMonth)/uAbsMonth.length : 1;
    const k7 = uN ? uSameClose / uN : 1;
    const rrU = uN ? uUlang / uN : 0;
    const prIntU = uN ? uInt / uN : 0;
    const sku = Math.max(0, Math.min(100, Math.round(100 - 100*(0.4*rrU + 0.3*prIntU + 0.2*(1-k7) + 0.1*(1-k5)))));

    return {
      id: u.id, nama: u.nama, role: u.role,
      total: uN, done: uDone, ulang: uUlang, kendala: uKend, durasi: uDur,
      lateMonth: uLateMonth, lateTotal: uLateTotal, sku
    };
  });

  // Peringatan klien: SRK >= 30 atau punya >= 2 ulang/kendala
  const alertClients = clientRows.filter(r => r.srk >= 30 || (r.ulang + r.kendala >= 3));

  return {
    ym, today, periodT, todayT, distinctClients, totalT, doneT, closedT,
    closingPct, realisasiPct, ftrPct, rrPct, prPct, ulangCount, kendalaCount,
    compliancePct, avgLateMin, lateAbsCount: lateAbs.length,
    clientRows, alertClients, userRows
  };
}

  const lateUsers = kpi.userRows.filter(u=>u.role!=='superadmin' && (u.lateMonth>0 || u.lateTotal>0));
  const lateWarnHtml = lateUsers.length ? lateUsers.map(u=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#fef2f2;border-radius:7px;margin-bottom:6px;font-size:.8rem">
      <div><b>👤 ${esc(u.nama)}</b> — <span style="color:#dc2626"><b>${u.lateMonth}x</b> terlambat bulan ini</span> (total: ${u.lateTotal}x)</div>

    : `<div style="color:var(--sub);font-size:.82rem">✅ Semua karyawan masuk tepat waktu (≤ 08:00 WITA) bulan ini.</div>`;

      <td><b>${r.count}x</b> ${r.ulang?`<span class="badge b-warn">${r.ulang} ulang</span>`:''}</td>
      <td style="font-size:.75rem;color:var(--sub)">${r.dates.map(d=>fmtDateL(d).slice(0,6)).join(', ')}</td>
      <td>${fmtDurHM(r.durasi)}</td>
      <td><span class="badge ${r.srk>=50?'b-urgent':r.srk>=30?'b-warn':'b-done'}">${r.srk}</span></td>
      <td style="font-size:.76rem">${r.diagnosis}</td>
    </tr>`).join('')
    : `<tr><td colspan="7" style="text-align:center;color:var(--sub);padding:18px">Belum ada transaksi tindakan pada ${BULAN_NAMA[dashFilter.bulan-1]} ${dashFilter.tahun}.</td></tr>`;

  const soon = nowWitaDate(); soon.setDate(soon.getDate()+7);
  const soonList = CACHE.pekerjaan.filter(p=>p.deadline&&p.status!=='Selesai'&&new Date(p.deadline)<=soon&&new Date(p.deadline)>=nowWitaDate()&&!p.parent_id).slice(0,4);
  const urgList = CACHE.pekerjaan.filter(p=>p.prioritas==='Urgent'&&p.status!=='Selesai'&&!p.parent_id).slice(0,4);

  return `
  ${!migrationReady?`<div class="alertBanner warn"><div>⚠️</div><div><b>Migrasi Database v2 Belum Dijalankan:</b> Jalankan file <code>migration_v2_kpi_tindakan.sql</code> di Supabase SQL Editor untuk mengaktifkan Pekerjaan Harian, Master Data &amp; KPI penuh.</div></div>`:''}

  <div class="dashFilter">
    <b style="font-size:.82rem;color:var(--text)">📅 Periode KPI:</b>
    <select onchange="dashFilter.bulan=+this.value;showPage('dashboard')">${bulanOpts}</select>
    <select onchange="dashFilter.tahun=+this.value;showPage('dashboard')">${tahunOpts}</select>
    <select onchange="dashFilter.userId=this.value;showPage('dashboard')"><option value="">Semua Karyawan</option>${userOpts}</select>
    <select onchange="dashFilter.klienId=this.value;showPage('dashboard')"><option value="">Semua Klien</option>${klienOpts}</select>
    <button class="btnPrimary" style="margin-left:auto;font-size:.78rem;padding:7px 14px" onclick="showPage('rencana')">Lihat Pekerjaan Harian →</button>

  <div class="cardGrid">
    <div class="card"><div class="cardIcon">👥</div><div class="cardVal">${staffHadirToday}/${staffCount}</div><div class="cardLabel">Hadir Hari Ini (${lateTodayCount} terlambat)</div><div class="cardAccent acc-blue"></div></div>
    <div class="card"><div class="cardIcon">⏰</div><div class="cardVal" style="color:${kpi.compliancePct>=95?'var(--green)':'var(--orange)'}">${kpi.compliancePct}%</div><div class="cardLabel">Kepatuhan Login ≤08:00 (rata telat ${kpi.avgLateMin}m)</div><div class="cardAccent acc-orange"></div></div>
    <div class="card"><div class="cardIcon">📋</div><div class="cardVal">${kpi.todayT.length}</div><div class="cardLabel">Tindakan Hari Ini (${kpi.totalT} bln ini)</div><div class="cardAccent acc-pink"></div></div>
    <div class="card"><div class="cardIcon">🏢</div><div class="cardVal">${kpi.distinctClients}</div><div class="cardLabel">Klien Dikerjakan Bulan Ini (K4)</div><div class="cardAccent acc-blue"></div></div>
    <div class="card"><div class="cardIcon">🎯</div><div class="cardVal" style="color:var(--green)">${kpi.ftrPct}%</div><div class="cardLabel">First-Time-Right (Tanpa Ulang)</div><div class="cardAccent acc-green"></div></div>
    <div class="card"><div class="cardIcon">🔁</div><div class="cardVal" style="color:${kpi.rrPct>15?'var(--red)':'var(--text)'}">${kpi.rrPct}%</div><div class="cardLabel">Rasio Pengulangan (${kpi.prPct}% kendala)</div><div class="cardAccent acc-orange"></div></div>

  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:14px;position:relative;z-index:1;margin-bottom:14px">
    <div class="section" style="margin-bottom:0">
      <div class="secHead"><h4>🚨 Peringatan Klien &amp; Indikasi Kelalaian (SRK / IKU)</h4></div>

    <div class="section" style="margin-bottom:0">
      <div class="secHead"><h4>⏰ Rekap Keterlambatan Karyawan (&gt; 08:00 WITA)</h4></div>

    </div>
  </div>

  <div class="chartGrid">
    <div class="chartCard span-8">
      <div class="secHead"><h4>📈 Tren Tindakan Harian (30 Hari Terakhir)</h4></div>

    <div class="chartCard span-4">

    <div class="chartCard span-8">

function initDashboardCharts(){
  if(typeof Chart==='undefined') return;
  const kpi = computeKPIs(dashFilter.bulan, dashFilter.tahun, dashFilter.userId, dashFilter.klienId);
  const PALETTE = ['#2563eb','#ec4899','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ef4444','#14b8a6','#6366f1','#f97316','#64748b'];

  // Jika asisten: grafik 14 hari pribadi
  const elUserTrend = document.getElementById('chUserTrend');
  if(elUserTrend && currentUser){
    const labels=[], tot=[], ulg=[];
    for(let i=13;i>=0;i--){
      const d = nowWitaDate(); d.setDate(d.getDate()-i);
      const ds = todayStr(d);
      labels.push(fmtDateL(ds).slice(0,6));
      const list = CACHE.tindakan.filter(t=>t.user_id===currentUser.id && t.tanggal_kerja===ds);
      tot.push(list.length);
      ulg.push(list.filter(t=>t.is_ulang).length);
    }
    dashCharts.userTrend = new Chart(elUserTrend, {
      type:'line',
      data:{ labels, datasets:[
        { label:'Total Tindakan', data:tot, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.12)', fill:true, tension:.35 },
        { label:'Pengulangan', data:ulg, borderColor:'#f59e0b', tension:.35 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
    return;
  }

  // 1. Line: Tren 30 Hari
  const elT30 = document.getElementById('chTrend30');
  if(elT30){
    const labels=[], dTot=[], dUlg=[], dKnd=[];
    for(let i=29;i>=0;i--){
      const d = nowWitaDate(); d.setDate(d.getDate()-i);
      const ds = todayStr(d);
      labels.push(ds.slice(8,10)+'/'+ds.slice(5,7));
      const list = CACHE.tindakan.filter(t=>t.tanggal_kerja===ds && (!dashFilter.userId||t.user_id===dashFilter.userId) && (!dashFilter.klienId||t.klien_id===dashFilter.klienId));
      dTot.push(list.length);
      dUlg.push(list.filter(t=>t.is_ulang).length);
      dKnd.push(list.filter(t=>t.kendala&&t.kendala.trim()!=='').length);
    }
    dashCharts.t30 = new Chart(elT30, {
      type:'line',
      data:{ labels, datasets:[
        { label:'Total Tindakan', data:dTot, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.1)', fill:true, tension:.3 },
        { label:'Pengulangan', data:dUlg, borderColor:'#f59e0b', tension:.3 },
        { label:'Ada Kendala', data:dKnd, borderColor:'#ef4444', tension:.3 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
  }

  // 2. Doughnut: Jenis Tindakan
  const elJD = document.getElementById('chJenisDonut');
  if(elJD){
    const map={};
    kpi.periodT.forEach(t=>{ const j=CACHE.jenis.find(x=>x.id===t.jenis_id); const nm=j?j.nama:'Lainnya'; map[nm]=(map[nm]||0)+1; });
    const entries = Object.entries(map);
    dashCharts.jd = new Chart(elJD, {
      type:'doughnut',
      data:{ labels: entries.length?entries.map(e=>e[0]):['Belum ada data'], datasets:[{ data: entries.length?entries.map(e=>e[1]):[1], backgroundColor: entries.length?PALETTE:['#e2e8f0'] }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:11, font:{ size:11 } } } } }
    });
  }

  // 3. Horizontal Stacked Bar: Top 10 Klien (K3)
  const elTK = document.getElementById('chTopKlien');
  if(elTK){
    const top10 = kpi.clientRows.slice(0,10);
    dashCharts.tk = new Chart(elTK, {
      type:'bar',
      data:{
        labels: top10.length?top10.map(r=>r.nama):['Belum ada data'],
        datasets:[
          { label:'Normal', data: top10.length?top10.map(r=>r.normalCount):[0], backgroundColor:'#2563eb' },
          { label:'Pengulangan', data: top10.length?top10.map(r=>r.ulang):[0], backgroundColor:'#f59e0b' }
        ]
      },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } }, scales:{ x:{ stacked:true, beginAtZero:true, ticks:{ precision:0 } }, y:{ stacked:true } } }
    });
  }

  // 4. Doughnut: Sistem Kerja
  const elSD = document.getElementById('chSistemDonut');
  if(elSD){
    const map={};
    kpi.periodT.forEach(t=>{ const s=CACHE.sistem.find(x=>x.id===t.sistem_id); const nm=s?s.nama:'Lainnya'; map[nm]=(map[nm]||0)+1; });
    const entries = Object.entries(map);
    dashCharts.sd = new Chart(elSD, {
      type:'doughnut',
      data:{ labels: entries.length?entries.map(e=>e[0]):['Belum ada data'], datasets:[{ data: entries.length?entries.map(e=>e[1]):[1], backgroundColor: entries.length?PALETTE:['#e2e8f0'] }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{ legend:{ position:'bottom', labels:{ boxWidth:11, font:{ size:11 } } } } }
    });
  }

  // 5. Grouped Bar: Kinerja per Karyawan
  const elUB = document.getElementById('chUserBar');
  if(elUB){
    const uList = kpi.userRows.filter(u=>u.role!=='superadmin' || u.total>0);
    dashCharts.ub = new Chart(elUB, {
      type:'bar',
      data:{
        labels: uList.map(u=>u.nama),
        datasets:[
          { label:'Selesai', data:uList.map(u=>u.done), backgroundColor:'#10b981' },
          { label:'Pengulangan', data:uList.map(u=>u.ulang), backgroundColor:'#f59e0b' },
          { label:'Kendala', data:uList.map(u=>u.kendala), backgroundColor:'#ef4444' }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
  }

  // 6. Line: Jam Login Harian vs 08:00 WITA
  const elLL = document.getElementById('chLoginLine');
  if(elLL){
    const labels=[];
    for(let i=13;i>=0;i--){
      const d=nowWitaDate(); d.setDate(d.getDate()-i);
      labels.push(todayStr(d));
    }
    const staff = CACHE.users.filter(u=>u.role!=='superadmin');
    const datasets = staff.map((u,idx)=>({
      label: u.nama,
      data: labels.map(ds=>{
        const ab = CACHE.absensi.find(a=>a.user_id===u.id && a.tanggal===ds);
        if(!ab || !ab.jam) return null;
        const [hh,mm] = ab.jam.split(':').map(Number);
        return Number((hh + mm/60).toFixed(2));
      }),
      borderColor: PALETTE[idx % PALETTE.length],
      spanGaps: true,
      tension: .25
    }));
    datasets.push({
      label: 'Batas 08:00 WITA',
      data: labels.map(()=>8),
      borderColor: '#ef4444',
      borderDash: [6,4],
      pointRadius: 0
    });
    dashCharts.ll = new Chart(elLL, {
      type:'line',
      data:{ labels: labels.map(ds=>ds.slice(8,10)+'/'+ds.slice(5,7)), datasets },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom' }, tooltip:{ callbacks:{ label: ctx => {
          const v = ctx.parsed.y; if(v==null) return '';
          const hh = Math.floor(v), mm = Math.round((v-hh)*60);
          return `${ctx.dataset.label}: ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} WITA`;
        }}}},
        scales:{ y:{ min:6, max:12, ticks:{ callback: v => String(v).padStart(2,'0')+':00' } } }
      }
    });
  }
}

function showClientKpiModal(klienId){
  const kpi = computeKPIs(dashFilter.bulan, dashFilter.tahun, dashFilter.userId, '');
  const row = kpi.clientRows.find(r=>r.klien_id===klienId);
  if(!row) return;
  const itemsHtml = row.items.slice().sort((a,b)=>b.tanggal_kerja.localeCompare(a.tanggal_kerja)).map(t=>{
    const u = CACHE.users.find(x=>x.id===t.user_id);
    const s = CACHE.sistem.find(x=>x.id===t.sistem_id);
    const j = CACHE.jenis.find(x=>x.id===t.jenis_id);
    return `<tr>
      <td>${fmtDate(t.tanggal_kerja)}</td>
      <td>${esc(u?u.nama:'-')}</td>
      <td>${esc(s?s.nama:'-')}</td>
      <td>${esc(j?j.nama:'-')}${t.is_ulang?` <span class="badge b-warn">Ulang</span>`:''}</td>
      <td>${t.durasi_detik?fmtDurHM(t.durasi_detik):'-'}</td>
      <td style="font-size:.75rem">${t.kendala?`<span style="color:var(--red)">${esc(t.kendala)}</span>`:'<span style="color:var(--sub)">Normal</span>'}</td>
    </tr>`;
  }).join('');
  document.getElementById('modalBox').innerHTML = `
    <h4>🏢 Detail KPI Klien: ${esc(row.nama)}</h4>
    <p style="font-size:.82rem;color:var(--sub);margin-bottom:10px">
      Periode: <b>${BULAN_NAMA[dashFilter.bulan-1]} ${dashFilter.tahun}</b> · Total: <b>${row.count} tindakan</b> · Pengulangan: <b>${row.ulang}x</b> · Kendala: <b>${row.kendala}x</b> · SRK: <b>${row.srk}</b>
    </p>
    <div class="alertBanner ${row.srk>=50?'danger':row.srk>=30?'warn':'info'}" style="margin-bottom:12px">
      <div>${row.diagnosis}<br><span style="font-size:.76rem">Tanggal dikerjakan: ${row.dates.map(fmtDateL).join(', ')}</span></div>
    </div>
    <div style="overflow-x:auto;max-height:320px;overflow-y:auto">
      <table><thead><tr><th>Tanggal</th><th>User</th><th>Sistem</th><th>Tindakan</th><th>Durasi</th><th>Kendala</th></tr></thead>
      <tbody>${itemsHtml}</tbody></table>
    </div>
    <div class="flex mt10"><button onclick="closeModal()" class="btnPrimary">Tutup</button></div>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}

// ===== KLIEN (Admin only) =====
function renderKlien(q='',pg=1,rpp=rowsPerPageKlien){
  if(!isAdmin()) return`<div class="accessDenied"><div class="icon">⛔</div><p>Halaman ini hanya dapat diakses oleh <b>Admin</b>.</p></div>`;
  let list=CACHE.klien.filter(k=>!q||(k.nama+' '+(k.npwp||'')+(k.nama_kontak||'')).toLowerCase().includes(q.toLowerCase()));
  const total=list.length;
  const totalPages=rpp>=999999?1:(Math.ceil(total/rpp)||1);
  pg=Math.max(1,Math.min(pg,totalPages));
  pageKlien=pg;
  const start=(pg-1)*rpp;
  const paged=rpp>=999999?list:list.slice(start, start+rpp);
  const rows=paged.length?paged.map(k=>{
    const jml=CACHE.pekerjaan.filter(p=>p.klien_id===k.id&&!p.parent_id).length;
    const done=CACHE.pekerjaan.filter(p=>p.klien_id===k.id&&p.status==='Selesai'&&!p.parent_id).length;
    const pct=jml?Math.round(done/jml*100):0;
    return`<tr>
      <td><b>${esc(k.nama)}</b></td>
      <td>${esc(k.npwp||'-')}</td>
      <td>${esc(k.bidang||'-')}</td>
      <td>${esc(k.nama_kontak||'-')}</td>
      <td>${esc(k.kontak||'-')}</td>
      <td>${esc(k.email||'-')}</td>
      <td>${jml}<span style="color:var(--sub);font-size:.74rem"> (${done} selesai)</span>
        <div class="progressBar"><div class="progressFill" style="width:${pct}%"></div></div></td>
      <td>
        <button class="btnSm btnEdit" onclick="modalKlien('${k.id}')">✏️</button>
        <button class="btnSm btnDanger" onclick="delKlien('${k.id}')">🗑️</button>
      </td></tr>`;
  }).join(''):`<tr><td colspan="8" style="color:var(--sub);text-align:center;padding:20px">Belum ada klien</td></tr>`;

  const pgButtons = totalPages>1
    ? `<div class="pgNums">${Array.from({length:totalPages},(_,i)=>i+1).map(p=>`<button class="pgBtn ${p===pg?'active':''}" onclick="pageKlien=${p};renderKlienPage()">${p}</button>`).join('')}</div>`
    : '';
  const pgFooter = total>0 ? `
    <div class="pgBar">
      <div class="pgLeft">
        <span>Tampilkan</span>
        <select onchange="rowsPerPageKlien=+this.value;pageKlien=1;renderKlienPage()">
          <option value="10" ${rpp===10?'selected':''}>10</option>
          <option value="20" ${rpp===20?'selected':''}>20</option>
          <option value="999999" ${rpp>=999999?'selected':''}>Semua</option>
        </select>
        <span>Menampilkan ${start+1}-${Math.min(start+rpp,total)} dari ${total} data</span>
      </div>
      ${pgButtons}
    </div>` : '';

  return`<div class="section" style="position:relative;z-index:1">
    <div class="secHead"><h4>Manajemen Klien / Rekanan</h4>
    <div class="flex">

function modalKlien(id=''){
  if(!isAdmin()){ toast('⛔ Hanya Admin yang dapat mengelola klien'); return; }
  const k=id?CACHE.klien.find(x=>x.id===id):null;
  document.getElementById('modalBox').innerHTML=`<h4>${k?'Edit':'Tambah'} Klien</h4>
    <div class="formGrid">
      <div class="formGroup full"><label>Nama Perusahaan *</label><input id="fkN" value="${k?esc(k.nama):''}"/></div>
      <div class="formGroup"><label>NPWP</label><input id="fkNPWP" placeholder="00.000.000.0-000.000" value="${k?esc(k.npwp||''):''}"/></div>
      <div class="formGroup"><label>Bidang Usaha</label><input id="fkB" value="${k?esc(k.bidang||''):''}"/></div>
      <div class="formGroup"><label>PIC</label><input id="fkNK" value="${k?esc(k.nama_kontak||''):''}"/></div>
      <div class="formGroup"><label>No. Kontak</label><input id="fkK" value="${k?esc(k.kontak||''):''}"/></div>
      <div class="formGroup full"><label>Email</label><input id="fkE" value="${k?esc(k.email||''):''}"/></div>
      <div class="formGroup full"><label>Catatan</label><textarea id="fkC">${k?esc(k.catatan||''):''}</textarea></div>
    </div>
    <div class="flex mt10"><button class="btnPrimary" onclick="saveKlien('${id}')">💾 Simpan</button>
    <button onclick="closeModal()" class="btnSm btnGray" style="padding:9px 16px;font-size:.84rem">Batal</button></div>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}

async function saveKlien(id){
  if(!isAdmin()){ toast('⛔ Hanya Admin'); return; }
  const nama=document.getElementById('fkN').value.trim();
  if(!nama) return alert('Nama wajib!');
  const data={nama, nama_kontak:document.getElementById('fkNK').value, npwp:document.getElementById('fkNPWP').value, bidang:document.getElementById('fkB').value, kontak:document.getElementById('fkK').value, email:document.getElementById('fkE').value, catatan:document.getElementById('fkC').value};
  if(id) await sb.from('klien').update(data).eq('id',id);
  else { await sb.from('klien').insert(data); pageKlien=1; }
  await loadAll(); closeModal();
  const qK=document.getElementById('srchKlien')?.value||'';
  document.getElementById('pageContent').innerHTML=renderKlien(qK,pageKlien,rowsPerPageKlien);
  toast('✅ Klien tersimpan!');
}

async function delKlien(id){
  if(!isAdmin()){ toast('⛔ Hanya Admin'); return; }
  if(!confirm('Hapus klien ini?')) return;
  const halamanSekarang = pageKlien;
  await sb.from('klien').delete().eq('id',id);
  await loadAll();
  const totalPages=Math.ceil(CACHE.klien.length/rowsPerPageKlien)||1;
  pageKlien = halamanSekarang > totalPages ? totalPages : halamanSekarang;
  const q=document.getElementById('srchKlien')?.value||'';
  document.getElementById('pageContent').innerHTML=renderKlien(q,pageKlien,rowsPerPageKlien);
  toast('🗑️ Klien dihapus');
}
// ===== PEKERJAAN (DATATABLE LOG PEKERJAAN + PROYEK) =====
const KATEGORI=['Laporan Keuangan','SPT Tahunan','SPT Masa','Rekonsiliasi','Audit','Payroll','Pembukuan','Lainnya'];
let pekMode = 'datatable'; // 'datatable' | 'proyek'

function renderPekerjaan(fK='',fS='',fP='',fU='',q='',pg=1,rpp=rowsPerPagePek){
  if(pekMode === 'datatable'){
    const dari = pekFilter.dari || '';
    const sampai = pekFilter.sampai || '';
    const fu = pekFilter.userId || '';
    const fk = pekFilter.klienId || '';
    const fs = pekFilter.status || '';
    const fq = (pekFilter.q || '').toLowerCase();

    let rows = (CACHE.tindakan || []).slice();
    if(dari)   rows = rows.filter(t => t.tanggal_kerja >= dari);
    if(sampai) rows = rows.filter(t => t.tanggal_kerja <= sampai);
    if(fu)     rows = rows.filter(t => t.user_id === fu);
    if(fk)     rows = rows.filter(t => t.klien_id === fk);
    if(fs)     rows = rows.filter(t => t.status === fs);
    if(fq){
      rows = rows.filter(t => {
        const k = CACHE.klien.find(x=>x.id===t.klien_id)?.nama || '';
        const u = CACHE.users.find(x=>x.id===t.user_id)?.nama || '';
        const s = CACHE.sistem.find(x=>x.id===t.sistem_id)?.nama || '';
        const j = CACHE.jenis.find(x=>x.id===t.jenis_id)?.nama || '';
        return (k+' '+u+' '+s+' '+j+' '+(t.uraian||'')+' '+(t.kendala||'')).toLowerCase().includes(fq);
      });
    }
    rows.sort((a,b) => b.tanggal_kerja.localeCompare(a.tanggal_kerja) || (b.created_at||'').localeCompare(a.created_at||''));

    const total = rows.length;
    const totalDur = rows.reduce((s,t)=>s+(t.durasi_detik||0),0);
    const totalDone = rows.filter(t=>t.status==='selesai').length;
    const totalUlang = rows.filter(t=>t.is_ulang).length;
    const totalPages = Math.ceil(total/rpp)||1;
    pg = Math.min(pg, totalPages);
    const paged = rows.slice((pg-1)*rpp, pg*rpp);

    const klienOpts = CACHE.klien.map(k=>`<option value="${k.id}" ${fk===k.id?'selected':''}>${esc(k.nama)}</option>`).join('');
    const userOpts = CACHE.users.map(u=>`<option value="${u.id}" ${fu===u.id?'selected':''}>${esc(u.nama)}</option>`).join('');

    const trs = paged.length ? paged.map((t,i)=>{
      const u = CACHE.users.find(x=>x.id===t.user_id);
      const k = CACHE.klien.find(x=>x.id===t.klien_id);
      const s = CACHE.sistem.find(x=>x.id===t.sistem_id);
      const j = CACHE.jenis.find(x=>x.id===t.jenis_id);
      const stBadge = t.status==='selesai' ? `<span class="badge b-done">✅ Selesai</span>`
        : t.status==='dikerjakan' ? `<span class="badge b-progress">🔄 Dikerjakan</span>`
        : t.status==='lanjut' ? `<span class="badge b-warn">⏭️ Lanjut</span>`
        : t.status==='bermasalah' ? `<span class="badge b-urgent">⚠️ Bermasalah</span>`
        : `<span class="badge b-plan">📋 Rencana</span>`;
      return `<tr>
        <td>${(pg-1)*rpp + i + 1}</td>
        <td style="white-space:nowrap">${fmtDate(t.tanggal_kerja)}</td>
        <td><b>${esc(u?u.nama:'-')}</b></td>
        <td><b>${esc(k?k.nama:'-')}</b><br><span style="font-size:.71rem;color:var(--sub)">${BULAN_SINGKAT[t.periode_bulan-1]} ${t.periode_tahun}</span></td>
        <td>${esc(s?s.nama:'-')}</td>
        <td>${esc(j?j.nama:'-')}${t.is_ulang?`<br><span class="badge b-warn">🔁 Ulang #${t.ulang_ke}</span>`:''}</td>

        <select onchange="pekFilter.status=this.value;pagePek=1;showPage('pekerjaan')">
          <option value="">Semua Status</option>
          <option value="selesai" ${fs==='selesai'?'selected':''}>Selesai</option>
          <option value="dikerjakan" ${fs==='dikerjakan'?'selected':''}>Dikerjakan</option>
          <option value="lanjut" ${fs==='lanjut'?'selected':''}>Lanjut</option>
          <option value="bermasalah" ${fs==='bermasalah'?'selected':''}>Bermasalah</option>
          <option value="rencana" ${fs==='rencana'?'selected':''}>Rencana</option>
        </select>
        <input placeholder="Cari uraian / sistem..." value="${esc(pekFilter.q||'')}" oninput="pekFilter.q=this.value;pagePek=1;showPage('pekerjaan')" style="width:170px"/>
      </div>
      <div class="kpiRow">
        <div class="kpiBox"><span class="kv">${total}</span><span class="kl">Total Pekerjaan</span></div>

      </div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>#</th><th>Tanggal</th><th>Nama User</th><th>Rekanan / Klien</th><th>Sistem</th><th>Jenis Tindakan</th><th>Uraian</th><th>Mulai</th><th>Selesai</th><th>Lama Pekerjaan</th><th>Status &amp; Kendala</th><th>Diskusi</th></tr></thead>
        <tbody>${trs}</tbody></table>
      </div>
      <div class="pagination">
        <span class="rowsLabel">Baris per halaman:</span>
        <select onchange="rowsPerPagePek=+this.value;pagePek=1;showPage('pekerjaan')">
          <option value="10" ${rpp===10?'selected':''}>10</option>
          <option value="20" ${rpp===20?'selected':''}>20</option>
          <option value="50" ${rpp===50?'selected':''}>50</option>
        </select>
        <button class="btnSm btnGray" onclick="pagePek--;document.getElementById('pageContent').innerHTML=renderPekerjaan('','','','','',pagePek,rowsPerPagePek)" ${pg<=1?'disabled':''}>‹</button>
        <span>Hal ${pg} / ${totalPages} (${total} data)</span>
        <button class="btnSm btnGray" onclick="pagePek++;document.getElementById('pageContent').innerHTML=renderPekerjaan('','','','','',pagePek,rowsPerPagePek)" ${pg>=totalPages?'disabled':''}>›</button>
      </div>
    </div>`;
  }

  let list=CACHE.pekerjaan.filter(p=>!p.parent_id);
  if(fK) list=list.filter(p=>p.klien_id===fK);
  if(fS) list=list.filter(p=>p.status===fS);
  if(fP) list=list.filter(p=>p.prioritas===fP);
  if(fU) list=list.filter(p=>p.user_id===fU||p.asisten_id===fU);
  if(q)  list=list.filter(p=>p.judul.toLowerCase().includes(q.toLowerCase()));
  list=[...list].sort((a,b)=>(a.prioritas==='Urgent'?0:1)-(b.prioritas==='Urgent'?0:1));
  const total=list.length;
  const totalPages=Math.ceil(total/rpp)||1;
  pg=Math.min(pg,totalPages);
  const klienOpts=CACHE.klien.map(k=>`<option value="${k.id}" ${fK===k.id?'selected':''}>${k.nama}</option>`).join('');
  const userOpts=CACHE.users.map(u=>`<option value="${u.id}" ${fU===u.id?'selected':''}>${u.nama}</option>`).join('');
  let viewContent='';
  if(currentView==='list'){
    const paged=list.slice((pg-1)*rpp,pg*rpp);
    const rows=paged.length?paged.map(p=>{
      const k=CACHE.klien.find(k=>k.id===p.klien_id);
      const u=CACHE.users.find(u=>u.id===p.user_id);
      const subs=CACHE.pekerjaan.filter(x=>x.parent_id===p.id);
      const doneSub=subs.filter(x=>x.status==='Selesai').length;
      const totalT=CACHE.timelogs.filter(t=>t.pek_id===p.id).reduce((s,t)=>s+(t.durasi||0),0);
      const late=p.deadline&&p.deadline.split('T')[0]<todayStr()&&p.status!=='Selesai';
      const canEdit=canEditPek(p);
      const creator=CACHE.users.find(u=>u.id===p.created_by);
      return`<tr style="cursor:pointer" onclick="openDetail('${p.id}')">
        <td><b>${p.judul}</b>${late?'<br><span style="color:var(--red);font-size:.7rem">⚠️ Terlambat</span>':''}
          ${subs.length?`<br><span style="font-size:.7rem;color:var(--sub)">${doneSub}/${subs.length} subtask</span>`:''}
          ${!canEdit?'<span class="lockBadge">🔒</span>':''}</td>
        <td>${k?k.nama:'-'}</td><td>${p.kategori||'-'}</td>
        <td><span class="badge ${badgeSt(p.status)}">${p.status}</span></td>
        <td><span class="badge ${p.prioritas==='Urgent'?'b-urgent':'b-normal'}">${p.prioritas}</span></td>
        <td>${u?u.nama:'-'}</td><td>${fmtDate(p.tanggal)}</td><td>${fmtDate(p.deadline)}</td>
        <td>${totalT?'⏱️ '+fmtDur(totalT):'-'}</td>
        <td onclick="event.stopPropagation()">
          ${canEdit?`<button class="btnSm btnEdit" onclick="modalPek('${p.id}')">✏️</button><button class="btnSm btnDanger" onclick="delPek('${p.id}')">🗑️</button>`:'<span style="font-size:.74rem;color:var(--sub)">🔒</span>'}
        </td></tr>`;
    }).join(''):`<tr><td colspan="10" style="color:var(--sub);text-align:center;padding:20px">Tidak ada data</td></tr>`;
    const pagination=`<div class="pagination">
      <span class="rowsLabel">Baris per halaman:</span>
      <select onchange="rowsPerPagePek=+this.value;pagePek=1;renderPekerjaanPage()">
        <option value="10" ${rpp===10?'selected':''}>10</option>
        <option value="15" ${rpp===15?'selected':''}>15</option>
        <option value="20" ${rpp===20?'selected':''}>20</option>
      </select>
      <button class="btnSm btnGray" onclick="pagePek--;renderPekerjaanPage()" ${pg<=1?'disabled':''}>‹</button>
      <span>Hal ${pg} / ${totalPages} (${total} data)</span>
      <button class="btnSm btnGray" onclick="pagePek++;renderPekerjaanPage()" ${pg>=totalPages?'disabled':''}>›</button>
    </div>`;
    viewContent=`<div style="overflow-x:auto"><table><thead><tr><th>Pekerjaan</th><th>Klien</th><th>Kategori</th><th>Status</th><th>Prioritas</th><th>Dikerjakan</th><th>Tgl</th><th>Deadline</th><th>Waktu</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>${pagination}`;
  } else if(currentView==='board'){
    const cols=['Belum Dimulai','Dalam Proses','Selesai'];
    viewContent=`<div class="kanbanWrap">${cols.map(col=>{
      const items=list.filter(p=>p.status===col);
      return`<div class="kanbanCol" ondragover="event.preventDefault()" ondrop="dropKanban(event,'${col}')">
        <h5>${col==='Belum Dimulai'?'📋':col==='Dalam Proses'?'🔄':'✅'} ${col} <span style="background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px;font-size:.74rem">${items.length}</span></h5>
        ${items.map(p=>{const k=CACHE.klien.find(k=>k.id===p.klien_id);return`<div class="kanbanCard ${p.prioritas.toLowerCase()}" draggable="true" ondragstart="dragKanban(event,'${p.id}')" onclick="openDetail('${p.id}')">
          <h6>${p.judul}${!canEditPek(p)?'<span class="lockBadge">🔒</span>':''}</h6><p>${k?k.nama:'-'}</p>
          <div class="cardMeta"><span class="badge ${p.prioritas==='Urgent'?'b-urgent':'b-normal'}" style="font-size:.68rem">${p.prioritas}</span>
          ${p.deadline?`<span style="font-size:.7rem;color:var(--sub)">${fmtDate(p.deadline)}</span>`:''}
          </div></div>`;}).join('')}
      </div>`;}).join('')}</div>`;
  } else {
    viewContent=renderCalendar(list);
  }
  return`<div class="section" style="position:relative;z-index:1">
    <div class="secHead">
      <h4>Log & Rencana Pekerjaan</h4>
      <div class="flex">
        <div class="viewToggle">
          <button class="viewBtn" onclick="pekMode='datatable';showPage('pekerjaan')">📊 Datatable Pekerjaan</button>
          <button class="viewBtn active" onclick="pekMode='proyek';showPage('pekerjaan')">🗂️ Proyek / Kanban</button>

          <button class="viewBtn ${currentView==='board'?'active':''}" onclick="setView('board')">⊞ Board</button>
          <button class="viewBtn ${currentView==='calendar'?'active':''}" onclick="setView('calendar')">📅 Kalender</button>
        </div>
        <button class="btnPrimary" onclick="modalPek()">+ Tambah</button>
      </div>
    </div>
    <div class="filterBar">
      <input style="padding:6px 9px;border:1.5px solid var(--gray2);border-radius:6px;font-size:.79rem;width:180px" placeholder="Cari..." id="srchPek" value="${q}" oninput="pagePek=1;applyFlt()"/>
      <select id="fltK" onchange="pagePek=1;applyFlt()"><option value="">Semua Klien</option>${klienOpts}</select>
      <select id="fltS" onchange="pagePek=1;applyFlt()"><option value="">Semua Status</option>
        <option ${fS==='Belum Dimulai'?'selected':''}>Belum Dimulai</option>
        <option ${fS==='Dalam Proses'?'selected':''}>Dalam Proses</option>
        <option ${fS==='Selesai'?'selected':''}>Selesai</option></select>
      <select id="fltP" onchange="pagePek=1;applyFlt()"><option value="">Semua Prioritas</option>
        <option ${fP==='Normal'?'selected':''}>Normal</option>
        <option ${fP==='Urgent'?'selected':''}>Urgent</option></select>
      <select id="fltU" onchange="pagePek=1;applyFlt()"><option value="">Semua User</option>${userOpts}</select>
    </div>
    ${viewContent}
  </div>`;
}

function setView(v){currentView=v;showPage('pekerjaan');}
function applyFlt(){
  const fK=document.getElementById('fltK')?.value||'';
  const fS=document.getElementById('fltS')?.value||'';
  const fP=document.getElementById('fltP')?.value||'';
  const fU=document.getElementById('fltU')?.value||'';
  const q=document.getElementById('srchPek')?.value||'';
  pagePek=1;
  document.getElementById('pageContent').innerHTML=renderPekerjaan(fK,fS,fP,fU,q,pagePek,rowsPerPagePek);
}
function exportPekerjaanCSV(){
  let rows = (CACHE.tindakan || []).slice();
  if(pekFilter.dari) rows = rows.filter(t=>t.tanggal_kerja>=pekFilter.dari);
  if(pekFilter.sampai) rows = rows.filter(t=>t.tanggal_kerja<=pekFilter.sampai);
  if(pekFilter.userId) rows = rows.filter(t=>t.user_id===pekFilter.userId);
  if(pekFilter.klienId) rows = rows.filter(t=>t.klien_id===pekFilter.klienId);
  if(pekFilter.status) rows = rows.filter(t=>t.status===pekFilter.status);
  const q = (pekFilter.q||'').toLowerCase();
  if(q) rows = rows.filter(t=>{
    const k = CACHE.klien.find(x=>x.id===t.klien_id)?.nama||'';
    const u = CACHE.users.find(x=>x.id===t.user_id)?.nama||'';
    const s = CACHE.sistem.find(x=>x.id===t.sistem_id)?.nama||'';
    const j = CACHE.jenis.find(x=>x.id===t.jenis_id)?.nama||'';
    return (k+' '+u+' '+s+' '+j+' '+(t.uraian||'')+' '+(t.kendala||'')).toLowerCase().includes(q);
  });
  const csvEsc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const lines = [['Tanggal','User','Klien','Periode','Sistem','Jenis Tindakan','Uraian','Mulai WITA','Selesai WITA','Lama Pekerjaan','Durasi (detik)','Status','Kendala'].map(csvEsc).join(',')];
  rows.forEach(t=>{
    const u=CACHE.users.find(x=>x.id===t.user_id)?.nama||'';
    const k=CACHE.klien.find(x=>x.id===t.klien_id)?.nama||'';
    const s=CACHE.sistem.find(x=>x.id===t.sistem_id)?.nama||'';
    const j=CACHE.jenis.find(x=>x.id===t.jenis_id)?.nama||'';
    lines.push([t.tanggal_kerja,u,k,`${BULAN_SINGKAT[t.periode_bulan-1]} ${t.periode_tahun}`,s,j,t.uraian||'',t.mulai_at?fmtTimeWita(t.mulai_at):'',t.selesai_at?fmtTimeWita(t.selesai_at):'',t.durasi_detik?fmtDur(t.durasi_detik):'',t.durasi_detik||0,t.status,t.kendala||''].map(csvEsc).join(','));
