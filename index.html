function renderCalendar(list){
  const y=calYear, m=calMonth;
  const days=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

  // Kelompokkan rencana_harian berdasarkan tanggal
  const rByDate={};
  CACHE.rencana.forEach(r=>{
    const d=r.tanggal; if(!rByDate[d])rByDate[d]=[]; rByDate[d].push(r);
  });

  let cells='';
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  for(let i=0;i<firstDay;i++) cells+=`<div class="calCell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayR=rByDate[ds]||[];
    const isToday=ds===todayStr();
    // Kelompokkan per user
    const byUser={};
    dayR.forEach(r=>{ if(!byUser[r.user_id])byUser[r.user_id]=[]; byUser[r.user_id].push(r); });
    const hasData=dayR.length>0;
    const userTags=Object.entries(byUser).map(([uid,items])=>{
      const u=CACHE.users.find(x=>x.id===uid);
      const done=items.filter(r=>r.status==='selesai').length;
      return `<span class="calUserBadge" title="${u?u.nama:'?'}: ${done}/${items.length} selesai">${u?u.nama.split(' ')[0]:'?'} (${items.length})</span>`;
    }).join('');
    cells+=`<div class="calCell${isToday?' today':''}${!hasData?' empty':''}" ${hasData?`onclick="showCalDayDetail('${ds}')"`:''}>
      <div class="calDate">${d}</div>${userTags}
    </div>`;
  }
  const isCurrentMonth=y===new Date().getFullYear()&&m===new Date().getMonth();
  return`<div class="calWrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="prevMonth()" style="padding:6px 14px;border:1.5px solid var(--gray2);border-radius:7px;background:#fff;cursor:pointer;font-size:.84rem;font-weight:600">‹ Sebelumnya</button>
      <div style="text-align:center">
        <span style="font-weight:700;color:var(--text);font-size:.95rem">${months[m]} ${y}</span>
        ${!isCurrentMonth?`<br><button onclick="backToCurrentMonth()" style="font-size:.74rem;color:var(--blue);background:none;border:none;cursor:pointer;margin-top:2px">● Kembali ke bulan ini</button>`:''}
      </div>
      <button onclick="nextMonth()" style="padding:6px 14px;border:1.5px solid var(--gray2);border-radius:7px;background:#fff;cursor:pointer;font-size:.84rem;font-weight:600">Berikutnya ›</button>
    </div>
    <div class="calGrid">${days.map(d=>`<div class="calHead">${d}</div>`).join('')}${cells}</div>
    <div style="font-size:.74rem;color:var(--sub);margin-top:8px">💡 Klik tanggal untuk melihat detail rencana harian</div>
  </div>`;
}

function showCalDayDetail(ds){
  const dayR=CACHE.rencana.filter(r=>r.tanggal===ds).sort((a,b)=>a.user_id.localeCompare(b.user_id)||a.urutan-b.urutan);
  const mo=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const [y,mo2,d]=ds.split('-');
  const tgl=`${parseInt(d)} ${mo[parseInt(mo2)-1]} ${y}`;
  const byUser={};
  dayR.forEach(r=>{ if(!byUser[r.user_id])byUser[r.user_id]=[]; byUser[r.user_id].push(r); });
  const content=Object.keys(byUser).length?Object.entries(byUser).map(([uid,items])=>{
    const u=CACHE.users.find(x=>x.id===uid);
    const done=items.filter(r=>r.status==='selesai').length;
    const cos=[...new Set(items.map(r=>r.klien_id).filter(Boolean))].map(cid=>CACHE.klien.find(k=>k.id===cid)?.nama).filter(Boolean);
    return`<div style="margin-bottom:14px">
      <div style="font-weight:700;font-size:.85rem;color:var(--text);margin-bottom:6px;border-bottom:1px solid var(--gray2);padding-bottom:4px">
        👤 ${u?u.nama:'?'} — ${done}/${items.length} selesai · ${cos.length} perusahaan
      </div>
      ${items.map(r=>{
        const k=CACHE.klien.find(k=>k.id===r.klien_id);
        return`<div style="margin-bottom:6px;padding:8px 10px;background:var(--gray);border-radius:7px;border-left:3px solid ${r.status==='selesai'?'var(--green)':'var(--orange)'}">
          <div style="font-weight:600;font-size:.82rem">${esc(r.judul)} ${r.status==='selesai'?'✅':'🔄'}</div>
          <div style="font-size:.76rem;color:var(--sub)">🏢 ${esc(k?k.nama:'—')}</div>
          ${r.catatan?`<div style="font-size:.75rem;color:var(--sub);margin-top:2px">${esc(r.catatan)}</div>`:''}
          ${r.laporan?`<div style="font-size:.76rem;color:#065f46;margin-top:4px;background:#f0fdf4;border-radius:4px;padding:4px 7px">📝 ${esc(r.laporan)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }).join(''):`<p style="color:var(--sub);text-align:center;padding:20px 0">Tidak ada rencana</p>`;
  document.getElementById('modalBox').innerHTML=`<h4>📅 Rencana — ${tgl}</h4>${content}
    <button onclick="closeModal()" class="btnSm btnGray" style="padding:9px 16px;font-size:.84rem;margin-top:12px">Tutup</button>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}

function prevMonth(){
  calMonth--;
  if(calMonth<0){calMonth=11;calYear--;}
  showPage('pekerjaan');
  setTimeout(()=>setView('calendar'),10);
}

function nextMonth(){
  calMonth++;
  if(calMonth>11){calMonth=0;calYear++;}
  showPage('pekerjaan');
  setTimeout(()=>setView('calendar'),10);
}

function backToCurrentMonth(){
  calYear=new Date().getFullYear();
  calMonth=new Date().getMonth();
  showPage('pekerjaan');
  setTimeout(()=>setView('calendar'),10);
}

async function savePek(id){
  const p=id?CACHE.pekerjaan.find(x=>x.id===id):null;
  if(p&&!canEditPek(p)){ toast('⛔ Akses ditolak'); return; }
  const judul=document.getElementById('fpJ').value.trim();

  if(!judul) return alert('Judul wajib!');
  if(!klienId) return alert('Pilih klien!');

    user_id:document.getElementById('fpU').value||null, asisten_id:document.getElementById('fpA').value||null,

    tanggal:document.getElementById('fpT').value||null, deadline:document.getElementById('fpD').value||null,
    catatan:document.getElementById('fpC').value};
  if(!id) data.created_by=currentUser.id;
  if(id) await sb.from('pekerjaan').update(data).eq('id',id);
  else   await sb.from('pekerjaan').insert(data);
  await loadAll(); closeModal(); showPage('pekerjaan'); toast('✅ Pekerjaan tersimpan!');
}

async function delPek(id){
  const p=CACHE.pekerjaan.find(x=>x.id===id);

// TIME TRACKER
function startTimer(pId){
  if(timerInterval)stopTimer();
  timerPekId=pId; timerStart=Date.now(); timerElapsed=0;
  document.getElementById('timerStartBtn').classList.add('hidden');
  document.getElementById('timerStopBtn').classList.remove('hidden');
  timerInterval=setInterval(()=>{
    timerElapsed=Math.floor((Date.now()-timerStart)/1000);
    const m=Math.floor(timerElapsed/60),s=timerElapsed%60;
    const el=document.getElementById('timerDisp');
    if(el)el.textContent=`${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  },1000);
}
async function stopTimer(){
  if(!timerInterval)return;
  clearInterval(timerInterval); timerInterval=null;
  if(timerElapsed>0&&timerPekId){
    await sb.from('timelogs').insert({pek_id:timerPekId,user_id:currentUser?currentUser.id:null,durasi:timerElapsed,tanggal:todayStr()});
    await loadAll(); toast('⏱️ Waktu tersimpan: '+fmtDur(timerElapsed));
  }
  timerElapsed=0; timerPekId=null;
}

      <div id="docListEl">
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Judul</th><th>Nama File</th><th>Pekerjaan Terkait</th><th>Klien</th><th>Link</th><th>Tgl Update</th><th>Aksi</th></tr></thead>
          <tbody>
          ${CACHE.docs.length?CACHE.docs.map(d=>{
            const p=CACHE.pekerjaan.find(x=>x.id===d.pek_id);
            const k=p?CACHE.klien.find(x=>x.id===p.klien_id):d.klien_id?CACHE.klien.find(x=>x.id===d.klien_id):null;
            return`<tr>
              <td><b>${d.judul||'Tanpa Judul'}</b></td>
              <td>${d.nama_file||'-'}</td>
              <td>${p?p.judul:'-'}</td>
              <td>${k?k.nama:'-'}</td>
              <td>${d.link_dokumen?`<a href="${safeUrl(d.link_dokumen)}" target="_blank" rel="noopener noreferrer" style="color:var(--blue);font-size:.8rem;text-decoration:none">🔗 Buka File</a>`:'-'}</td>
              <td>${fmtDateL(d.updated_at)}</td>
              <td>
                <button class="btnSm btnEdit" onclick="openDoc('${d.id}')">✏️</button>
                <button class="btnSm btnDanger" onclick="delDoc('${d.id}')">🗑️</button>
              </td>
            </tr>`;
          }).join(''):`<tr><td colspan="7" style="text-align:center;color:var(--sub);padding:20px">Belum ada dokumen</td></tr>`}
          </tbody>
        </table>
        </div>
      </div>
    </div>
    <div class="docEditor hidden" id="docEditorEl">
      <div class="secHead">
        <div class="flex">
          <button class="btnSm btnGray" onclick="backDocs()">← Kembali</button>
        </div>
        <button class="btnPrimary" onclick="saveDoc()">💾 Simpan</button>
      </div>
      <div class="formGrid" style="margin-bottom:14px">
        <div class="formGroup full"><label>Judul Dokumen</label><input id="docTitleEl" placeholder="Judul dokumen..."/></div>
        <div class="formGroup"><label>Nama File</label><input id="docNamaFile" placeholder="Contoh: Laporan Keuangan Q1.pdf"/></div>
        <div class="formGroup"><label>Link Dokumen (Google Drive / Dropbox / dll)</label><input id="docLink" placeholder="https://drive.google.com/..."/></div>
        <div class="formGroup"><label>Pekerjaan Terkait</label>
          <select id="docPekId"><option value="">-- Tanpa Pekerjaan --</option>${pekOpts}</select></div>
        <div class="formGroup"><label>Klien (jika tanpa pekerjaan)</label>
          <select id="docKlien"><option value="">-- Tanpa Klien --</option>
          ${CACHE.klien.map(k=>`<option value="${k.id}">${k.nama}</option>`).join('')}</select></div>
        <div class="formGroup full"><label>Catatan / Isi Dokumen</label>
          <textarea id="docBodyEl" placeholder="Tulis catatan atau deskripsi dokumen..." style="min-height:120px"></textarea></div>
      </div>
    </div>
  </div>`;
}
function newDoc(){currentDocId=null;showDocEditor({judul:'',body:'',klien_id:'',pek_id:'',nama_file:'',link_dokumen:''});}
function openDoc(id){
  const d=CACHE.docs.find(x=>x.id===id);
  if(!d)return;
  currentDocId=id;
  showDocEditor(d);
}
function showDocEditor(d){
  document.getElementById('docListEl').classList.add('hidden');
  document.getElementById('docEditorEl').classList.remove('hidden');
  document.getElementById('docTitleEl').value=d.judul||'';
  document.getElementById('docBodyEl').value=d.body||'';
  document.getElementById('docNamaFile').value=d.nama_file||'';
  document.getElementById('docLink').value=d.link_dokumen||'';
  setTimeout(()=>{
    const sk=document.getElementById('docKlien');if(sk)sk.value=d.klien_id||'';
    const sp=document.getElementById('docPekId');if(sp)sp.value=d.pek_id||'';
  },50);
}
function backDocs(){
  document.getElementById('docListEl').classList.remove('hidden');
  document.getElementById('docEditorEl').classList.add('hidden');
  currentDocId=null;
}
async function saveDoc(){
  const judul=document.getElementById('docTitleEl').value;
  const body=document.getElementById('docBodyEl').value;
  const klienId=document.getElementById('docKlien').value||null;
  const pekId=document.getElementById('docPekId').value||null;
  const nama_file=document.getElementById('docNamaFile').value;
  const link_dokumen=document.getElementById('docLink').value;
  const updated_at=todayStr();
  const data={judul,body,klien_id:klienId,pek_id:pekId,nama_file,link_dokumen,updated_at};
  if(currentDocId) await sb.from('docs').update(data).eq('id',currentDocId);
  else{ const {data:res}=await sb.from('docs').insert(data).select(); if(res)currentDocId=res[0].id; }
  await loadAll(); toast('✅ Dokumen tersimpan!');
}
async function delDoc(id){
  if(!confirm('Hapus dokumen?'))return;
  await sb.from('docs').delete().eq('id',id);
  await loadAll(); showPage('docs'); toast('🗑️ Dokumen dihapus');
}

// ===== ABSENSI (KALENDER FIXED GRID 1 BULAN + POPUP DETAIL) =====
function renderAbsensi(){
  const isRowLate = a => a.terlambat===true || a.tipe==='Terlambat' || (a.jam && a.jam>'08:00');
  const today = todayStr();
  const ym = `${abCalYear}-${String(abCalMonth+1).padStart(2,'0')}`;

  // Rekap keterlambatan per user pada bulan kalender aktif
  const userLateSummary = CACHE.users.filter(u=>u.role!=='superadmin').map(u=>{
    const all = CACHE.absensi.filter(a=>a.user_id===u.id);
    const lMonth = all.filter(a=>a.tanggal&&a.tanggal.startsWith(ym)&&isRowLate(a)).length;
    const lTotal = all.filter(isRowLate).length;
    return `<div class="abCard">
      <div class="dot" style="background:${lMonth>0?'var(--red)':'var(--green)'}"></div>
      <div><b>${esc(u.nama)}</b><br><span style="font-size:.72rem;color:${lMonth>0?'#dc2626':'var(--sub)'}">Telat bln ini: <b>${lMonth}x</b> (total ${lTotal}x)</span></div>
    </div>`;
  }).join('');

  // Bangun fixed grid kalender 7 kolom
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const firstDow = new Date(abCalYear, abCalMonth, 1).getDay();
  const daysInMonth = new Date(abCalYear, abCalMonth + 1, 0).getDate();
  const curMY = witaMonthYear();
  const isCurMonth = (abCalYear === curMY.tahun && (abCalMonth + 1) === curMY.bulan);

  let cells = '';
  for(let i=0; i<firstDow; i++){
    cells += `<div class="calCell empty" style="min-height:115px;height:auto"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${abCalYear}-${String(abCalMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const abDay = CACHE.absensi.filter(a=>a.tanggal===ds);
    const tDay  = CACHE.tindakan.filter(t=>t.tanggal_kerja===ds);
    const uids  = [...new Set([...abDay.map(a=>a.user_id), ...tDay.map(t=>t.user_id)])].filter(Boolean);

    const userPills = uids.map(uid=>{
      const u = CACHE.users.find(x=>x.id===uid);
      const ab = abDay.find(a=>a.user_id===uid);
      const cnt = tDay.filter(t=>t.user_id===uid).length;
      const late = ab && isRowLate(ab);
      const jamIn = ab?.jam || '-';
      const jamOut = ab?.jam_keluar || '';
      const bg = late ? '#dc2626' : (jamOut ? '#059669' : '#2563eb');
      return `<div class="calUserBadge" style="background:${bg};cursor:pointer;padding:3px 5px;margin-bottom:2px" onclick="event.stopPropagation();showAbsensiDayDetailModal('${uid}','${ds}')" title="Klik untuk detail kegiatan">
        <b>${esc(u?u.nama:(ab?.nama||'?'))}</b> · ${cnt} tind.<br>
        <span style="font-size:.6rem;opacity:.92">${jamIn}${jamOut?'–'+jamOut:''} WITA</span>
      </div>`;
    }).join('');

    cells += `<div class="calCell${ds===today?' today':''}" style="min-height:115px;height:auto;cursor:default">
      <div class="calDate" style="display:flex;justify-content:space-between"><span>${d}</span>${uids.length?`<span style="font-size:.65rem;color:var(--sub)">${tDay.length}x</span>`:''}</div>
      ${userPills}
    </div>`;
  }

  return`<div class="section" style="position:relative;z-index:1">
    <div class="secHead"><h4>Rekap Keterlambatan (${BULAN_NAMA[abCalMonth]} ${abCalYear})</h4>
      <button class="btnPrimary" onclick="modalAbsensi()">+ Absensi Manual</button>
    </div>
    <div class="abToday">${userLateSummary||'-'}</div>
  </div>
  <div class="section" style="position:relative;z-index:1">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <button onclick="prevAbMonth()" style="padding:6px 14px;border:1.5px solid var(--gray2);border-radius:7px;background:#fff;cursor:pointer;font-size:.84rem;font-weight:600">‹ Bulan Sebelumnya</button>
      <div style="text-align:center">
        <span style="font-weight:800;color:var(--text);font-size:1rem">📅 ${BULAN_NAMA[abCalMonth]} ${abCalYear}</span>
        ${!isCurMonth?`<br><button onclick="backToCurAbMonth()" style="font-size:.74rem;color:var(--blue);background:none;border:none;cursor:pointer;margin-top:2px">● Kembali ke bulan ini</button>`:''}
      </div>
      <button onclick="nextAbMonth()" style="padding:6px 14px;border:1.5px solid var(--gray2);border-radius:7px;background:#fff;cursor:pointer;font-size:.84rem;font-weight:600">Bulan Berikutnya ›</button>
    </div>
    <div style="font-size:.74rem;color:var(--sub);margin-bottom:8px;display:flex;gap:12px;flex-wrap:wrap">
      <span><span class="badge" style="background:#2563eb;color:#fff">Biru</span> Sedang kerja / belum closing akhir hari</span>
      <span><span class="badge" style="background:#059669;color:#fff">Hijau</span> Sudah closing akhir hari (ada jam keluar)</span>
      <span><span class="badge" style="background:#dc2626;color:#fff">Merah</span> Terlambat (&gt; 08:00 WITA)</span>
      <span>💡 Klik nama user di kalender untuk melihat detail kegiatan.</span>
    </div>
    <div style="overflow-x:auto">
      <div class="calGrid" style="grid-template-columns:repeat(7,minmax(110px,1fr))">${days.map(d=>`<div class="calHead">${d}</div>`).join('')}${cells}</div>
    </div>
  </div>`;
}
function prevAbMonth(){ abCalMonth--; if(abCalMonth<0){abCalMonth=11;abCalYear--;} showPage('absensi'); }
function nextAbMonth(){ abCalMonth++; if(abCalMonth>11){abCalMonth=0;abCalYear++;} showPage('absensi'); }
function backToCurAbMonth(){ const my=witaMonthYear(); abCalYear=my.tahun; abCalMonth=my.bulan-1; showPage('absensi'); }

function showAbsensiDayDetailModal(uid, ds){
  const u = CACHE.users.find(x=>x.id===uid);
  const ab = CACHE.absensi.find(a=>a.user_id===uid && a.tanggal===ds);
  const items = CACHE.tindakan.filter(t=>t.user_id===uid && t.tanggal_kerja===ds).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  const isRowLate = a => a && (a.terlambat===true || a.tipe==='Terlambat' || (a.jam && a.jam>'08:00'));
  const late = isRowLate(ab);
  const totalDur = items.reduce((s,t)=>s+(t.durasi_detik||0),0);

  const rowsHtml = items.length ? items.map((t,i)=>{
    const k = CACHE.klien.find(x=>x.id===t.klien_id);
    const s = CACHE.sistem.find(x=>x.id===t.sistem_id);
    const j = CACHE.jenis.find(x=>x.id===t.jenis_id);
    return `<tr>
      <td>${i+1}</td>
      <td><b>${esc(k?k.nama:'-')}</b><br><span style="font-size:.7rem;color:var(--sub)">${BULAN_SINGKAT[t.periode_bulan-1]} ${t.periode_tahun}</span></td>
      <td>${esc(s?s.nama:'-')}</td>
      <td>${esc(j?j.nama:'-')}${t.is_ulang?` <span class="badge b-warn">Ulang</span>`:''}</td>
      <td>${esc(t.uraian||'-')}</td>
      <td style="white-space:nowrap">${t.mulai_at?fmtTimeWita(t.mulai_at):'-'} – ${t.selesai_at?fmtTimeWita(t.selesai_at):'-'}</td>
      <td><b>${t.durasi_detik?fmtDurHM(t.durasi_detik):'-'}</b></td>
      <td>${t.status}${t.kendala?`<br><span style="font-size:.7rem;color:#dc2626">⚠️ ${esc(t.kendala)}</span>`:''}</td>
      <td>${chatBtnHtml(t.id)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--sub);padding:16px">Belum ada catatan tindakan pada tanggal ini.</td></tr>`;

  document.getElementById('modalBox').style.width = '840px';
  document.getElementById('modalBox').innerHTML = `
    <h4>📅 Detail Absensi &amp; Kegiatan — ${esc(u?u.nama:(ab?.nama||'-'))} (${fmtDateL(ds)})</h4>
    <div style="display:flex;gap:10px;flex-wrap:wrap;background:var(--gray);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.82rem">
      <span>🟢 Masuk: <b>${ab?ab.jam+' WITA':'Belum absen'}</b> ${late?`<span class="badge b-late">Terlambat</span>`:''}</span>
      <span>🏁 Keluar: <b>${ab&&ab.jam_keluar?ab.jam_keluar+' WITA':'Belum closing akhir hari'}</b></span>
      <span>📋 Total Tindakan: <b>${items.length}</b></span>
      <span>⏱️ Total Lama Kerja: <b>${fmtDurHM(totalDur)}</b></span>
    </div>
    <div style="overflow-x:auto;max-height:360px;overflow-y:auto">
      <table><thead><tr><th>#</th><th>Klien &amp; Periode</th><th>Sistem</th><th>Jenis Tindakan</th><th>Uraian</th><th>Waktu (WITA)</th><th>Durasi</th><th>Status</th><th>Diskusi</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table>
    </div>
    <div class="flex mt10"><button onclick="document.getElementById('modalBox').style.width='';closeModal()" class="btnPrimary">Tutup</button></div>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}
function modalAbsensi(){
  const uOpts=CACHE.users.map(u=>`<option value="${u.id}">${u.nama}</option>`).join('');
  document.getElementById('modalBox').innerHTML=`<h4>Absensi Manual</h4>
    <div class="formGrid">
      <div class="formGroup full"><label>User</label><select id="abU">${uOpts}</select></div>
      <div class="formGroup"><label>Tanggal</label><input type="date" id="abT" value="${todayStr()}"/></div>
      <div class="formGroup"><label>Jam</label><input type="time" id="abJ" value="${nowTime()}"/></div>
    </div>
    <div class="flex mt10"><button class="btnPrimary" onclick="saveAbsensi()">💾 Simpan</button>
    <button onclick="closeModal()" class="btnSm btnGray" style="padding:9px 16px;font-size:.84rem">Batal</button></div>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}
async function saveAbsensi(){
  const uId=document.getElementById('abU').value;
  const u=CACHE.users.find(x=>x.id===uId);
  const jam=document.getElementById('abJ').value;
  const [hh,mm]=jam.split(':').map(Number);
  const isLate=(hh>8||(hh===8&&mm>0));
  const menitTerlambat=isLate?Math.max(0,(hh-8)*60+mm):0;
  const payload={user_id:uId,nama:u.nama,tanggal:document.getElementById('abT').value,jam,tipe:'Manual',terlambat:isLate,menit_terlambat:menitTerlambat};
  const {error}=await sb.from('absensi').insert(payload);
  if(error) await sb.from('absensi').insert({user_id:uId,nama:u.nama,tanggal:document.getElementById('abT').value,jam,tipe:'Manual'});
  await loadAll(); closeModal(); showPage('absensi'); toast('✅ Absensi tersimpan!');
}

// ===== USERS =====
function renderUsers(){
  const rows=CACHE.users.map(u=>{
    const jml=CACHE.pekerjaan.filter(p=>p.user_id===u.id||p.asisten_id===u.id).length;
    const totalT=CACHE.timelogs.filter(t=>t.user_id===u.id).reduce((s,t)=>s+(t.durasi||0),0);
    return`<tr><td><b>${esc(u.nama)}</b></td><td>${u.role==='superadmin'?'Superadmin':u.role==='admin'?'Admin / Akuntan':'Asisten'}</td><td>${jml}</td><td>${fmtDur(totalT)}</td>
      <td>
        <button class="btnSm btnEdit" onclick="modalUser('${u.id}')">✏️</button>
        ${CACHE.users.length>1?`<button class="btnSm btnDanger" onclick="delUser('${u.id}')">🗑️</button>`:''}
      </td></tr>`;
  }).join('');
  const addBtn=isAdmin()?`<button class="btnPrimary" onclick="modalUser()">+ Tambah User</button>`:`<span style="font-size:.8rem;color:var(--sub)">🔒 Hanya Admin yang dapat menambah user</span>`;
  return`<div class="section" style="position:relative;z-index:1">
    <div class="secHead"><h4>Daftar User</h4>${addBtn}</div>
    <table><thead><tr><th>Nama</th><th>Role</th><th>Pekerjaan</th><th>Total Waktu</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}
function modalUser(id=''){
  if(!isAdmin()&&!id){ toast('⛔ Hanya Admin yang dapat menambah user baru'); return; }
  const u=id?CACHE.users.find(x=>x.id===id):null;
  document.getElementById('modalBox').innerHTML=`<h4>${u?'Edit':'Tambah'} User</h4>
    <div class="formGrid">
      <div class="formGroup full"><label>Nama *</label><input id="fuN" value="${u?esc(u.nama):''}"/></div>
      <div class="formGroup"><label>Role</label><select id="fuR" ${!isAdmin()?'disabled':''}>
        ${u&&u.role==='superadmin'?`<option value="superadmin" selected disabled>Superadmin</option>`:''}
        <option value="admin" ${u&&u.role==='admin'?'selected':''}>Admin / Akuntan</option>
        <option value="asisten" ${(!u||u.role==='asisten')?'selected':''}>Asisten</option></select></div>
      <div class="formGroup"><label>PIN (opsional)</label><input type="password" id="fuP" placeholder="Kosongkan = tanpa PIN"/></div>
    </div>
    <div class="flex mt10"><button class="btnPrimary" onclick="saveUser('${id}')">💾 Simpan</button>
    <button onclick="closeModal()" class="btnSm btnGray" style="padding:9px 16px;font-size:.84rem">Batal</button></div>`;
  document.getElementById('modalWrap').classList.remove('hidden');
}
async function saveUser(id){
  if(!isAdmin()&&!id){ toast('⛔ Hanya Admin'); return; }
  const nama=document.getElementById('fuN').value.trim(); if(!nama)return alert('Nama wajib!');
  const pin=document.getElementById('fuP').value;
  const target=id?CACHE.users.find(x=>x.id===id):null;
  let role=isAdmin()?document.getElementById('fuR').value:'asisten';
  if(target&&target.role==='superadmin') role='superadmin';
  const data={nama,role};
  if(pin)data.pin=pin;
  if(id) await sb.from('users').update(data).eq('id',id);
  else   await sb.from('users').insert(data);
  await loadAll(); closeModal(); showPage('users'); toast('✅ User tersimpan!');
}
async function delUser(id){
  if(!isAdmin()){ toast('⛔ Hanya Admin'); return; }
  if(!confirm('Hapus user?'))return;
  await sb.from('users').delete().eq('id',id);
  await loadAll(); showPage('users'); toast('🗑️ User dihapus');
}

    <td><code>${esc(j.kode)}</code></td>

      <button class="btnSm btnEdit" onclick="modalJenis('${j.id}')">✏️</button>

    </td>
  </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--sub)">Belum ada data (jalankan migrasi SQL v2)</td></tr>`;

  return`<div style="position:relative;z-index:1">
    <div class="section">
      <div class="secHead"><h4>💻 Master Sistem Kerja (Keberadaan Pekerjaan)</h4><button class="btnPrimary" onclick="modalSistem()">+ Tambah Sistem</button></div>
      <p style="font-size:.8rem;color:var(--sub);margin-bottom:10px">Pilihan tempat pekerjaan dilakukan (ABSS, Access App, Excel Sheet, NextBO, dll.). Dapat ditambah kapan saja.</p>
      <div style="overflow-x:auto"><table><thead><tr><th>Kode</th><th>Nama Sistem</th><th>Urutan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${sRows}</tbody></table></div>

// ===== PEKERJAAN HARIAN (RENCANA + MULAI/SELESAI + CLOSING + KPI HARIAN K1 & K2) =====
function renderRencana(){
  const today = todayStr();
  const fltTgl = tindakanFilter.tanggal || today;
  const fltKlien = tindakanFilter.klienId || '';
  const fltUser = isAdmin() ? (tindakanFilter.userId || '') : currentUser.id;

  // Cek baris belum closing dari hari sebelumnya (untuk asisten)
  const unclosedPrev = !isAdmin()
    ? CACHE.tindakan.filter(t=>t.user_id===currentUser.id && t.tanggal_kerja<today && (t.status==='rencana'||t.status==='dikerjakan'))
    : [];

  let list = CACHE.tindakan.filter(t=>t.tanggal_kerja===fltTgl);
  if(fltUser) list = list.filter(t=>t.user_id===fltUser);
  if(fltKlien) list = list.filter(t=>t.klien_id===fltKlien);
  list.sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));

  const total = list.length;
  const rDone = list.filter(t=>t.status==='selesai').length;
  const rProc = list.filter(t=>t.status==='dikerjakan'||t.status==='rencana').length;
  const rCos  = new Set(list.map(t=>t.klien_id).filter(Boolean)).size;
  const totalDur = list.reduce((s,t)=>s+(t.durasi_detik||0),0);

  // K1 & K2: Ringkasan per Klien pada tanggal terpilih
  const byClient = {};
  list.forEach(t=>{
    if(!byClient[t.klien_id]) byClient[t.klien_id] = { klien_id: t.klien_id, items: [], dur: 0 };
    byClient[t.klien_id].items.push(t);
    byClient[t.klien_id].dur += (t.durasi_detik || 0);
  });
  const k1k2Html = Object.values(byClient).map(bc=>{
    const k = CACHE.klien.find(x=>x.id===bc.klien_id);
    const detailDur = bc.items.map(t=>{
      const j = CACHE.jenis.find(x=>x.id===t.jenis_id);
      return `<span class="tag">${esc(j?j.kode:'?')}: ${t.durasi_detik?fmtDurHM(t.durasi_detik):t.status}</span>`;
    }).join(' ');
    return `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--gray);border-radius:8px;margin-bottom:6px;font-size:.8rem">
      <div><b>🏢 ${esc(k?k.nama:'-')}</b> — <b>${bc.items.length}</b> tindakan &nbsp; ${detailDur}</div>
      <div><b>⏱️ Total: ${fmtDurHM(bc.dur)}</b></div>
    </div>`;
  }).join('') || `<div style="color:var(--sub);font-size:.82rem">Belum ada tindakan pada tanggal ${fmtDateL(fltTgl)}.</div>`;

  // Unclosed previous banner
  const unclosedHtml = unclosedPrev.length ? `
    <div class="alertBanner danger">
      <div style="font-size:1.3rem">🔒</div>
      <div style="flex:1">
        <b>Ada ${unclosedPrev.length} Tindakan Hari Sebelumnya Belum Di-Closing!</b><br>
        Anda wajib melakukan closing untuk pekerjaan tanggal sebelumnya sebelum menambah rencana hari ini:
        <div style="margin-top:8px">
          ${unclosedPrev.map(t=>{
            const k=CACHE.klien.find(x=>x.id===t.klien_id);
            const j=CACHE.jenis.find(x=>x.id===t.jenis_id);
            return `<div style="display:flex;justify-content:space-between;align-items:center;background:#fff;padding:6px 10px;border-radius:6px;margin-bottom:4px;color:var(--text)">
              <span><b>${fmtDate(t.tanggal_kerja)}</b> · ${esc(k?k.nama:'-')} · ${esc(j?j.nama:'-')}</span>
              <button class="btnTiny" style="background:#dc2626;color:#fff" onclick="selesaiTindakan('${t.id}')">⏹ Closing Sekarang</button>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>` : '';

  const rowsHtml = list.length ? list.map((t,i)=>{
    const u = CACHE.users.find(x=>x.id===t.user_id);
    const k = CACHE.klien.find(x=>x.id===t.klien_id);
    const s = CACHE.sistem.find(x=>x.id===t.sistem_id);
    const j = CACHE.jenis.find(x=>x.id===t.jenis_id);
    const canAct = isAdmin() || t.user_id === currentUser.id;
    let stBadge = '';
    if(t.status==='selesai') stBadge = `<span class="badge b-done">✅ Selesai</span>`;
    else if(t.status==='dikerjakan') stBadge = `<span class="badge b-progress">🔄 Dikerjakan</span>`;
    else if(t.status==='lanjut') stBadge = `<span class="badge b-warn">⏭️ Lanjut</span>`;
    else if(t.status==='bermasalah') stBadge = `<span class="badge b-urgent">⚠️ Bermasalah</span>`;
    else stBadge = `<span class="badge b-plan">📋 Rencana</span>`;

    let actBtns = '';
    if(canAct){
      if(t.status==='rencana'){
        actBtns = `<button class="btnTiny" style="background:#d1fae5;color:#059669" onclick="mulaiTindakan('${t.id}')">▶ Mulai</button>
          <button class="btnTiny" style="background:#dbeafe;color:#2563eb;margin-top:3px" onclick="selesaiTindakan('${t.id}')">⏹ Closing</button>`;
      } else if(t.status==='dikerjakan'){
        actBtns = `<button class="btnTiny" style="background:#fee2e2;color:#dc2626" onclick="selesaiTindakan('${t.id}')">⏹ Selesai &amp; Closing</button>`;
      } else {
        actBtns = `<span style="font-size:.72rem;color:var(--sub)">Tutup ${t.closing_at?fmtTimeWita(t.closing_at):''}</span>`;
      }
    }

    return `<tr>
      <td>${i+1}</td>
      ${isAdmin()?`<td><b>${esc(u?u.nama:'-')}</b></td>`:''}
      <td><b>${esc(k?k.nama:'-')}</b><br><span style="font-size:.72rem;color:var(--sub)">Periode: ${BULAN_SINGKAT[t.periode_bulan-1]} ${t.periode_tahun}</span></td>
      <td>${esc(s?s.nama:'-')}</td>
      <td>${esc(j?j.nama:'-')}${t.is_ulang?`<br><span class="badge b-warn">🔁 Ulang #${t.ulang_ke}</span>`:''}</td>
      <td style="max-width:200px">${esc(t.uraian||'-')}${t.alasan_ulang?`<br><span style="font-size:.71rem;color:#b45309">Alasan ulang: ${esc(t.alasan_ulang)}</span>`:''}</td>
      <td style="white-space:nowrap">${t.mulai_at?fmtTimeWita(t.mulai_at):'-'}</td>
      <td style="white-space:nowrap">${t.selesai_at?fmtTimeWita(t.selesai_at):'-'}</td>
      <td style="white-space:nowrap"><b>${t.durasi_detik?fmtDurHM(t.durasi_detik):'-'}</b></td>
      <td>${stBadge}${t.kendala?`<div style="font-size:.72rem;color:#dc2626;margin-top:3px">⚠️ ${esc(t.kendala)}</div>`:''}</td>
      <td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">${actBtns}${chatBtnHtml(t.id)}</div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="${isAdmin()?11:10}" style="text-align:center;color:var(--sub);padding:24px">Belum ada tindakan pada tanggal ini.</td></tr>`;

  const todayAb = !isAdmin() ? CACHE.absensi.find(a=>a.user_id===currentUser.id && a.tanggal===today) : null;
  const endDayBtn = (!isAdmin() && !unclosedPrev.length && total>0 && !rProc && (!todayAb || !todayAb.jam_keluar))
    ? `<button class="btnSm" style="background:#059669;color:#fff;padding:9px 14px;font-size:.82rem;font-weight:600" onclick="closingAkhirHari()">🏁 Closing Akhir Hari</button>`
    : (todayAb && todayAb.jam_keluar ? `<span class="badge b-done">🏁 Selesai Hari Ini (${todayAb.jam_keluar} WITA)</span>` : '');

  const addBtn = unclosedPrev.length
    ? `<button class="btnPrimary" style="opacity:.5;cursor:not-allowed" disabled>+ Tambah Tindakan (Closing kemarin dulu)</button>`
    : `<div class="flex">${endDayBtn}<button class="btnPrimary" onclick="modalTambahRencana()">+ Tambah Tindakan Harian</button></div>`;

  const klienOpts = CACHE.klien.map(k=>`<option value="${k.id}" ${fltKlien===k.id?'selected':''}>${esc(k.nama)}</option>`).join('');
  const userOpts = CACHE.users.filter(u=>u.role!=='superadmin').map(u=>`<option value="${u.id}" ${fltUser===u.id?'selected':''}>${esc(u.nama)}</option>`).join('');

  return `<div style="position:relative;z-index:1">
    ${unclosedHtml}
    <div class="section">
      <div class="secHead">
        <h4>🗓️ Pekerjaan Harian — ${fmtDateL(fltTgl)} (WITA)</h4>
        ${addBtn}
      </div>
      <div class="filterBar">
        <input type="date" value="${fltTgl}" onchange="tindakanFilter.tanggal=this.value;showPage('rencana')"/>
        <select onchange="tindakanFilter.klienId=this.value;showPage('rencana')"><option value="">Semua Klien</option>${klienOpts}</select>
        ${isAdmin()?`<select onchange="tindakanFilter.userId=this.value;showPage('rencana')"><option value="">Semua Karyawan</option>${userOpts}</select>`:''}
      </div>
      <div class="kpiRow">
        <div class="kpiBox"><span class="kv">${total}</span><span class="kl">Total Tindakan</span></div>
        <div class="kpiBox"><span class="kv" style="color:var(--green)">${rDone}</span><span class="kl">Selesai</span></div>
        <div class="kpiBox"><span class="kv" style="color:var(--orange)">${rProc}</span><span class="kl">Aktif / Rencana</span></div>
        <div class="kpiBox"><span class="kv" style="color:var(--blue)">${rCos}</span><span class="kl">Klien Hari Ini (K1)</span></div>
        <div class="kpiBox"><span class="kv" style="font-size:1.2rem">${fmtDurHM(totalDur)}</span><span class="kl">Total Waktu (K2)</span></div>
      </div>
      <div style="margin-bottom:14px">
        <div style="font-size:.8rem;font-weight:700;color:var(--sub);margin-bottom:6px">📊 KPI Harian per Klien &amp; Durasi per Tindakan (K1 &amp; K2):</div>
        ${k1k2Html}
      </div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>#</th>${isAdmin()?'<th>User</th>':''}<th>Klien &amp; Periode</th><th>Sistem</th><th>Jenis Tindakan</th><th>Uraian</th><th>Mulai</th><th>Selesai</th><th>Durasi</th><th>Status &amp; Kendala</th><th>Aksi</th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>
    </div>
  </div>`;
}

function buildTindakanFormHtml(prefix){
  const curMY = witaMonthYear();
  const klienOpts = CACHE.klien.map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('');
  const sisOpts = CACHE.sistem.filter(s=>s.aktif).map(s=>`<option value="${s.id}">${esc(s.nama)}</option>`).join('');
  const jenOpts = CACHE.jenis.filter(j=>j.aktif).map(j=>`<option value="${j.id}">${esc(j.nama)}${!j.boleh_diulang?' (1x saja)':''}</option>`).join('');
  const blnOpts = BULAN_NAMA.map((b,i)=>`<option value="${i+1}" ${curMY.bulan===i+1?'selected':''}>${b}</option>`).join('');
  const thnOpts = [curMY.tahun-1, curMY.tahun, curMY.tahun+1].map(y=>`<option value="${y}" ${curMY.tahun===y?'selected':''}>${y}</option>`).join('');
  const alasanOpts = ALASAN_ULANG.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');

  return `<div class="formGrid">
    <div class="formGroup full"><label>Klien / Rekanan *</label>
      <select id="${prefix}Klien" onchange="cekRiwayatTindakan('${prefix}')"><option value="">-- Pilih Klien --</option>${klienOpts}</select></div>
    <div class="formGroup"><label>Periode Buku (Bulan) *</label>
      <select id="${prefix}Bulan" onchange="cekRiwayatTindakan('${prefix}')">${blnOpts}</select></div>
    <div class="formGroup"><label>Periode Buku (Tahun) *</label>
      <select id="${prefix}Tahun" onchange="cekRiwayatTindakan('${prefix}')">${thnOpts}</select></div>
    <div class="formGroup"><label>Sistem Kerja *</label>
      <select id="${prefix}Sistem" onchange="cekRiwayatTindakan('${prefix}')"><option value="">-- Pilih Sistem --</option>${sisOpts}</select></div>
    <div class="formGroup"><label>Jenis Tindakan *</label>
      <select id="${prefix}Jenis" onchange="cekRiwayatTindakan('${prefix}')"><option value="">-- Pilih Tindakan --</option>${jenOpts}</select></div>
    <div class="formGroup full" id="${prefix}WarnBox" style="display:none"></div>
    <div class="formGroup full" id="${prefix}AlasanWrap" style="display:none">
      <label>Alasan Pengulangan (Wajib karena membuka ulang tindakan) *</label>
      <select id="${prefix}Alasan">${alasanOpts}</select>
    </div>
    <div class="formGroup full"><label>Uraian / Keterangan Tindakan</label>
      <textarea id="${prefix}Uraian" style="min-height:60px" placeholder="Contoh: Input faktur penjualan 1–15 Nov, cek mutasi bank BCA..."></textarea></div>
  </div>`;
}

function cekRiwayatTindakan(prefix){
  const klienId = document.getElementById(prefix+'Klien')?.value;
  const bulan   = +document.getElementById(prefix+'Bulan')?.value;
  const tahun   = +document.getElementById(prefix+'Tahun')?.value;
  const sisId   = document.getElementById(prefix+'Sistem')?.value;
  const jenId   = document.getElementById(prefix+'Jenis')?.value;
  const warnBox = document.getElementById(prefix+'WarnBox');
  const alWrap  = document.getElementById(prefix+'AlasanWrap');
  const btnSave = document.getElementById(prefix+'BtnSave');
  if(!warnBox || !alWrap || !btnSave) return;

  warnBox.style.display='none'; alWrap.style.display='none'; btnSave.disabled=false; btnSave.style.opacity='1';
  if(!klienId || !sisId || !jenId) return;

  const prev = CACHE.tindakan.filter(t=>t.klien_id===klienId && t.sistem_id===sisId && t.periode_bulan===bulan && t.periode_tahun===tahun && t.jenis_id===jenId);
  if(!prev.length) return;

  const jen = CACHE.jenis.find(j=>j.id===jenId);
  const histTxt = prev.map(p=>{
    const u = CACHE.users.find(x=>x.id===p.user_id);
    return `${fmtDate(p.tanggal_kerja)} (${esc(u?u.nama:'-')}${p.kendala?', kendala: '+esc(p.kendala):''})`;
  }).join('; ');

  if(jen && !jen.boleh_diulang){
    warnBox.innerHTML = `<div class="alertBanner danger" style="margin:0"><div>⛔ <b>DITOLAK — Tidak Boleh Diulang!</b><br>Tindakan <b>${esc(jen.nama)}</b> untuk klien, sistem, dan periode ini sudah dilakukan pada: ${histTxt}.<br>Silakan pilih jenis tindakan lain (misal: <b>Checker → Review</b> atau <b>Koreksi / Revisi Temuan</b>) untuk memeriksa ulang.</div></div>`;
    warnBox.style.display='flex';
    btnSave.disabled = true; btnSave.style.opacity = '0.45';
  } else {
    warnBox.innerHTML = `<div class="alertBanner warn" style="margin:0"><div>🔁 <b>Pengulangan Tindakan (Ke-${prev.length}):</b> Tindakan ini sebelumnya sudah dikerjakan pada ${histTxt}. Wajib pilih alasan pengulangan di bawah.</div></div>`;
    warnBox.style.display='flex';
    alWrap.style.display='flex';
  }
}

function modalTambahRencana(){
  const today = todayStr();
  const unclosedPrev = !isAdmin() ? CACHE.tindakan.filter(t=>t.user_id===currentUser.id && t.tanggal_kerja<today && (t.status==='rencana'||t.status==='dikerjakan')) : [];
  if(unclosedPrev.length){
    toast('⛔ Selesaikan closing hari sebelumnya terlebih dahulu!'); return;
  }
  document.getElementById('modalBox').innerHTML=`<h4>➕ Tambah Tindakan Harian</h4>
    ${buildTindakanFormHtml('mr')}
    <div class="flex mt10">
      <button class="btnPrimary" id="mrBtnSave" onclick="submitTindakan('mr', false)">💾 Simpan Rencana</button>

async function submitTindakan(prefix, isForced){
  const klien_id = document.getElementById(prefix+'Klien').value;
  const periode_bulan = +document.getElementById(prefix+'Bulan').value;
  const periode_tahun = +document.getElementById(prefix+'Tahun').value;
  const sistem_id = document.getElementById(prefix+'Sistem').value;
  const jenis_id = document.getElementById(prefix+'Jenis').value;
  const uraian = document.getElementById(prefix+'Uraian').value.trim();
  if(!klien_id || !sistem_id || !jenis_id) return alert('Klien, Sistem Kerja, dan Jenis Tindakan wajib dipilih!');

  const prev = CACHE.tindakan.filter(t=>t.klien_id===klien_id && t.sistem_id===sistem_id && t.periode_bulan===periode_bulan && t.periode_tahun===periode_tahun && t.jenis_id===jenis_id);
  const jen = CACHE.jenis.find(j=>j.id===jenis_id);
  if(prev.length && jen && !jen.boleh_diulang){
    return alert('⛔ Data Entry → Checker tidak boleh diulang untuk periode yang sama!');
  }

  const is_ulang = prev.length > 0;
  const ulang_ke = prev.length;
  const ulang_dari_id = is_ulang ? prev[prev.length-1].id : null;
  const alasan_ulang = is_ulang ? document.getElementById(prefix+'Alasan').value : null;

  await syncServerTime();
  const nowIso = nowWitaDate().toISOString();
  const payload = {
    user_id: currentUser.id,
    tanggal_kerja: todayStr(),
    klien_id, periode_bulan, periode_tahun, sistem_id, jenis_id, uraian,
    is_ulang, ulang_ke, ulang_dari_id, alasan_ulang,
    mulai_at: isForced ? nowIso : null,
    status: isForced ? 'dikerjakan' : 'rencana'
  };
  const { error } = await sb.from('tindakan_harian').insert(payload);
  if(error) return alert('Gagal menyimpan: ' + error.message);

  await loadAll();
  if(isForced){
    document.getElementById('rencanaForceOverlay')?.remove();
    showPage('rencana');
    toast(`✅ Rencana dimulai pukul ${fmtTimeWita(nowIso)}!`);
  } else {
    closeModal();
    showPage('rencana');
    toast('✅ Tindakan ditambahkan!');
  }
}

async function saveForcedClosing(id, mulaiIso, selesaiIso, durasi){
  const status = document.getElementById('fcStatus').value;
  const katRaw = document.getElementById('fcKat').value;
  const kendala = document.getElementById('fcKendala').value.trim();
  let sifat_kendala = null, kategori_kendala = null;
  if(katRaw){ const p=katRaw.split('|'); sifat_kendala=p[0]; kategori_kendala=p[1]; }
  const finalKendala = kendala || (kategori_kendala || null);

  const { error } = await sb.from('tindakan_harian').update({
    mulai_at: mulaiIso, selesai_at: selesaiIso, durasi_detik: durasi,
    status, kategori_kendala, sifat_kendala, kendala: finalKendala, closing_at: selesaiIso
  }).eq('id', id);
  if(error) return alert('Gagal closing: '+error.message);

  await loadAll();
  document.getElementById('rencanaForceOverlay')?.remove();

  // Cek apakah masih ada tindakan lain yang belum di-closing
  const nextUnclosed = CACHE.tindakan
    .filter(t=>t.user_id===currentUser.id && (t.status==='rencana'||t.status==='dikerjakan'))
    .sort((a,b)=>a.tanggal_kerja.localeCompare(b.tanggal_kerja)||(a.created_at||'').localeCompare(b.created_at||''));
  if(nextUnclosed.length){
    showForcedClosingModal(nextUnclosed[0].id);
  } else {
    showAfterClosingChoiceModal();
  }
}

async function closingAkhirHari(fromOverlay=false){
  await syncServerTime();
  const today = todayStr();
  const jamKeluar = nowTime();
  const nowIso = nowWitaDate().toISOString();

  // Pastikan tidak ada yang masih terbuka
  const openTasks = CACHE.tindakan.filter(t=>t.user_id===currentUser.id && t.tanggal_kerja<=today && (t.status==='rencana'||t.status==='dikerjakan'));
  if(openTasks.length){
    toast('⚠️ Masih ada tindakan yang belum di-closing!');
    if(fromOverlay){ document.getElementById('rencanaForceOverlay')?.remove(); showForcedClosingModal(openTasks[0].id); }
    return;
  }

  const ab = CACHE.absensi.find(a=>a.user_id===currentUser.id && a.tanggal===today);
  if(ab){
    const { error } = await sb.from('absensi').update({ jam_keluar: jamKeluar, closing_hari_at: nowIso }).eq('id', ab.id);
    if(error){
      // fallback jika kolom jam_keluar belum dimigrasi
      toast('ℹ️ Jam keluar dicatat di sesi. Jalankan migration_v2_kpi_tindakan.sql untuk menyimpan jam_keluar.');
    }
  }
  await loadAll();
  if(fromOverlay) document.getElementById('rencanaForceOverlay')?.remove();
  showPage('dashboard');
  toast(`🏁 Closing akhir hari berhasil pukul ${jamKeluar} WITA! Terima kasih atas kerja kerasnya.`);
}

function getAllUnreadCommentsForUser(uid){
  return (CACHE.tcomments || []).filter(c => {
    if(c.user_id === uid) return false;
    const t = CACHE.tindakan.find(x=>x.id===c.tindakan_id);
    if(!t) return false;
    const isTargeted = (t.user_id === uid) || (Array.isArray(c.mention_ids) && c.mention_ids.includes(uid));
    const alreadyRead = Array.isArray(c.sudah_dibaca) && c.sudah_dibaca.includes(uid);
    return isTargeted && !alreadyRead;
  });
}

async function acknowledgeAllArahan(){
  const unread = getAllUnreadCommentsForUser(currentUser.id);
  const errors = [];
  for(const c of unread){
    const replyEl = document.getElementById('faReply_'+c.id);
    const replyTxt = replyEl ? replyEl.value.trim() : '';
    if(replyTxt){
      const {error:insErr} = await sb.from('tindakan_comments').insert({
        tindakan_id: c.tindakan_id,
        user_id: currentUser.id,
        pesan: replyTxt,
        is_instruksi: false,
        mention_ids: c.user_id ? [c.user_id] : [],
        sudah_dibaca: [currentUser.id]
      });
      if(insErr) errors.push(insErr.message);
    }
    const nextRead = [...new Set([...(c.sudah_dibaca||[]), currentUser.id])];
    const {error:updErr} = await sb.from('tindakan_comments').update({ sudah_dibaca: nextRead }).eq('id', c.id);
    if(updErr) errors.push(updErr.message);
  }
  if(errors.length){ toast('⚠️ Sebagian konfirmasi gagal: '+errors[0]); return; }
  await loadAll();
  document.getElementById('rencanaForceOverlay')?.remove();
  toast('✅ Semua tanggapan telah dikonfirmasi diketahui & di-closing!');
  if(!continueAssistantLoginFlow()) showPage('dashboard');
}

async function sendTindakanComment(tId){
  const pesan = document.getElementById('tcPesan').value.trim();
  if(!pesan) return alert('Tulis pesan tanggapan terlebih dahulu!');
  const is_instruksi = document.getElementById('tcInstruksi')?.checked || false;
  const mention_ids = [...document.querySelectorAll('.tcMention:checked')].map(el=>el.value);

  const { error } = await sb.from('tindakan_comments').insert({
    tindakan_id: tId,
    user_id: currentUser.id,
    pesan,
    is_instruksi,
    mention_ids,
    sudah_dibaca: [currentUser.id]
  });
  if(error) return alert('Gagal mengirim tanggapan (pastikan migrasi SQL terbaru sudah dijalankan): '+error.message);
  await loadAll();
  toast('✅ Tanggapan terkirim!');
  openTindakanDiskusi(tId);
}

function requestDesktopNotif(){
  if(!('Notification' in window)) return toast('Browser Anda tidak mendukung notifikasi desktop.');
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){ toast('✅ Notifikasi desktop diaktifkan!'); notifySuperadminDesktop(true); }
    else toast('ℹ️ Izin notifikasi desktop ditolak.');
  });
}

function notifySuperadminDesktop(force=false){
  if(!isAdmin() || !('Notification' in window) || Notification.permission!=='granted') return;
  const kpi = computeKPIs(dashFilter.bulan || witaMonthYear().bulan, dashFilter.tahun || witaMonthYear().tahun);
  const topAlert = kpi.alertClients[0];
  if(topAlert){
    new Notification(`⚠️ Perhatian Klien: ${topAlert.nama}`, {
      body: `SRK ${topAlert.srk} · ${topAlert.ulang}x ulang · ${topAlert.diagnosis.replace(/[^\w\s:().,-]/g,'')}`
    });
  } else if(force){
    new Notification('SiKerja Pro', { body: 'Notifikasi desktop aktif. Semua klien dalam kondisi normal.' });
  }
}

function getNotifs(){
  const today=todayStr(); const soon=nowWitaDate(); soon.setDate(soon.getDate()+3);
  const notifs=[];
  // Komentar / Arahan / Mention yang belum dibaca untuk user login
  if(currentUser){
    (CACHE.tcomments || []).forEach(c=>{
      if(c.user_id === currentUser.id) return;
      const t = CACHE.tindakan.find(x=>x.id===c.tindakan_id);
      if(!t) return;
      const isTargeted = (t.user_id === currentUser.id) || (Array.isArray(c.mention_ids) && c.mention_ids.includes(currentUser.id));
      const alreadyRead = Array.isArray(c.sudah_dibaca) && c.sudah_dibaca.includes(currentUser.id);
      if(isTargeted && !alreadyRead){
        const sender = CACHE.users.find(u=>u.id===c.user_id)?.nama || 'Rekan';
        const k = CACHE.klien.find(x=>x.id===t.klien_id)?.nama || '-';
        notifs.push({
          title: `${c.is_instruksi?'📌 Arahan':'💬 Catatan'} dari ${sender} (${k})`,
          sub: c.pesan.slice(0,80),
          action: `openTindakanDiskusi('${t.id}')`
        });
      }
    });
  }
  if(isAdmin() && migrationReady){
    const my = witaMonthYear();
    const kpi = computeKPIs(my.bulan, my.tahun);
    kpi.alertClients.slice(0,5).forEach(r=>{
      notifs.push({
        title: `${r.riskLevel==='kritis'?'🚨':'⚠️'} Klien Bermasalah: ${r.nama} (SRK ${r.srk})`,
        sub: `${r.ulang}x ulang · ${r.kendala}x kendala · ${r.diagnosis}`,
        action: `showClientKpiModal('${r.klien_id}')`
      });
    });
    const isRowLate = a => a.terlambat===true || a.tipe==='Terlambat' || (a.jam && a.jam>'08:00');
    CACHE.absensi.filter(a=>a.tanggal===today && isRowLate(a)).forEach(a=>{
      notifs.push({
        title: `⏰ Terlambat Hari Ini: ${a.nama}`,
        sub: `Masuk pukul ${a.jam} WITA`,
        action: `showPage('absensi')`
      });
    });
  }
  CACHE.pekerjaan.filter(p=>!p.parent_id).forEach(p=>{
    if(p.status==='Selesai')return;
    const dl=p.deadline?p.deadline.split('T')[0]:'';
    if(dl&&dl<today) notifs.push({title:'⚠️ Melewati Deadline',sub:`${p.judul} — ${fmtDate(dl)}`,action:`openDetail('${p.id}')`});
    else if(dl&&new Date(dl)<=soon) notifs.push({title:'⏰ Deadline Mendekat',sub:`${p.judul} — ${fmtDate(dl)}`,action:`openDetail('${p.id}')`});
    if(p.prioritas==='Urgent') notifs.push({title:'🔴 Urgent',sub:p.judul,action:`openDetail('${p.id}')`});
  });
  return notifs;
}
function renderNotifs(){
  const notifs=getNotifs();
  document.getElementById('notifDot').style.display=notifs.length?'inline-block':'none';
  document.getElementById('notifList').innerHTML=notifs.length
    ?notifs.slice(0,10).map(n=>`<div class="notifItem" onclick="${n.action};closeNotif()"><div class="ni-title">${n.title}</div><div class="ni-sub">${n.sub}</div></div>`).join('')
    :'<div style="padding:14px 16px;color:var(--sub);font-size:.82rem">Tidak ada notifikasi 🎉</div>';
}

function closeNotif(){document.getElementById('notifList').classList.remove('open');}
document.addEventListener('click',e=>{const nb=document.getElementById('notifBtn');if(nb&&!nb.contains(e.target))closeNotif();});

function closeModal(){document.getElementById('modalBox').style.width='';document.getElementById('modalWrap').classList.add('hidden');}
